<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">Two Different Questions</text>

  <rect x="40" y="60" width="220" height="150" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="150" y="90" text-anchor="middle" font-size="13" fill="#2b2620" font-weight="600">Was starting this</text>
  <text x="150" y="108" text-anchor="middle" font-size="13" fill="#2b2620" font-weight="600">a good decision?</text>
  <text x="150" y="140" text-anchor="middle" font-size="11" fill="#5c5648">useful for future</text>
  <text x="150" y="155" text-anchor="middle" font-size="11" fill="#5c5648">learning and judgment</text>

  <rect x="300" y="60" width="220" height="150" rx="10" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="410" y="90" text-anchor="middle" font-size="13" fill="#2b2620" font-weight="600">What's the best</text>
  <text x="410" y="108" text-anchor="middle" font-size="13" fill="#2b2620" font-weight="600">move from here?</text>
  <text x="410" y="140" text-anchor="middle" font-size="11" fill="#a15c3e" font-weight="600">sunk costs must be</text>
  <text x="410" y="155" text-anchor="middle" font-size="11" fill="#a15c3e" font-weight="600">ignored entirely</text>

  <text x="280" y="235" text-anchor="middle" font-size="12" fill="#8a7f6a">Easy to tangle together — only the second question governs the next move.</text>
</svg>
