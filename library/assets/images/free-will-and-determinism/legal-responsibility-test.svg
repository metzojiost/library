<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="240" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">What the Law Actually Asks</text>

  <rect x="40" y="55" width="220" height="130" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="150" y="80" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Not asked</text>
  <text x="150" y="115" text-anchor="middle" font-size="11" fill="#5c5648">"Was this act ultimately</text>
  <text x="150" y="131" text-anchor="middle" font-size="11" fill="#5c5648">caused by prior events?"</text>
  <text x="150" y="160" text-anchor="middle" font-size="10" fill="#8a7f6a">(true of every act, always)</text>

  <rect x="300" y="55" width="220" height="130" rx="10" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="410" y="80" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Actually asked</text>
  <text x="410" y="115" text-anchor="middle" font-size="11" fill="#2b2620">Own reasoning? Coerced?</text>
  <text x="410" y="131" text-anchor="middle" font-size="11" fill="#2b2620">Capacity to understand?</text>
  <text x="410" y="160" text-anchor="middle" font-size="10" fill="#a15c3e" font-weight="600">(narrow, practical, testable)</text>

  <text x="280" y="215" text-anchor="middle" font-size="11" fill="#8a7f6a">The law is compatibilist in practice, whether or not it says so.</text>
</svg>
