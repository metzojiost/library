<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="280" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">The Polyvagal Hierarchy</text>

  <rect x="130" y="50" width="300" height="55" rx="8" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="280" y="73" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Ventral vagal</text>
  <text x="280" y="90" text-anchor="middle" font-size="10" fill="#5c5648">social engagement, calm, safe</text>

  <rect x="130" y="115" width="300" height="55" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="280" y="138" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Sympathetic</text>
  <text x="280" y="155" text-anchor="middle" font-size="10" fill="#5c5648">fight or flight</text>

  <rect x="130" y="180" width="300" height="55" rx="8" fill="#8a7f6a" opacity="0.2" stroke="#8a7f6a"/>
  <text x="280" y="203" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Dorsal vagal</text>
  <text x="280" y="220" text-anchor="middle" font-size="10" fill="#5c5648">shutdown, freeze, numbness</text>

  <path d="M 280 105 L 280 115" stroke="#8a7f6a" stroke-width="1.5"/>
  <path d="M 280 170 L 280 180" stroke="#8a7f6a" stroke-width="1.5"/>

  <text x="280" y="260" text-anchor="middle" font-size="11" fill="#8a7f6a">Safety keeps the newest system engaged; escalating threat drops through older ones.</text>
</svg>
