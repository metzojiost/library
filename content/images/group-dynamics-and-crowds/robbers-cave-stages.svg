<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="220" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Three Stages at Robbers Cave</text>

  <rect x="30" y="55" width="150" height="80" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="105" y="90" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">Group identity</text>
  <text x="105" y="106" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">forms separately</text>

  <path d="M 185 95 L 215 95" stroke="#8a7f6a" stroke-width="2" marker-end="url(#armP)"/>

  <rect x="220" y="55" width="150" height="80" rx="8" fill="#a15c3e" opacity="0.2" stroke="#a15c3e"/>
  <text x="295" y="90" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">Competition</text>
  <text x="295" y="106" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">escalates hostility</text>

  <path d="M 375 95 L 405 95" stroke="#8a7f6a" stroke-width="2" marker-end="url(#armP)"/>

  <rect x="410" y="55" width="130" height="80" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="475" y="90" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">Superordinate</text>
  <text x="475" y="106" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">goals reduce it</text>

  <text x="280" y="175" text-anchor="middle" font-size="10" fill="#8a7f6a">Contact alone didn't help — shared, necessary cooperation did.</text>

  <defs>
    <marker id="armP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a7f6a"/>
    </marker>
  </defs>
</svg>
