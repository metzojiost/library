<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="520" height="380" fill="#ffffff"/>

  <circle cx="150" cy="170" r="95" fill="#f1e3d8" stroke="#a15c3e" stroke-width="2.5"/>
  <circle cx="150" cy="170" r="60" fill="#e0c4ab" stroke="#a15c3e" stroke-width="1.5"/>
