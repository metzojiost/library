  <text x="70" y="330" text-anchor="end" font-size="11" fill="#8a7f6a">0%</text>

  <text x="260" y="390" text-anchor="middle" font-size="12.5" fill="#8a7f6a" font-style="italic">Approximate rates from Milgram's obedience variations — small changes, large swings.</text>
