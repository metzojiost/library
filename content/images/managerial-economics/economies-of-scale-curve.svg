<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">Average Cost per Unit vs. Scale</text>

  <line x1="70" y1="250" x2="520" y2="250" stroke="#8a7f6a" stroke-width="1.5"/>
  <line x1="70" y1="250" x2="70" y2="60" stroke="#8a7f6a" stroke-width="1.5"/>
  <text x="295" y="280" text-anchor="middle" font-size="12" fill="#5c5648">Total output</text>
  <text x="40" y="150" text-anchor="middle" font-size="12" fill="#5c5648" transform="rotate(-90 40 150)">Avg. cost/unit</text>

  <path d="M 90 90 C 180 200, 280 230, 340 232 C 420 235, 480 200, 510 140" fill="none" stroke="#a15c3e" stroke-width="3"/>

  <text x="160" y="150" text-anchor="middle" font-size="11" fill="#5c5648">economies of scale</text>
  <text x="450" y="180" text-anchor="middle" font-size="11" fill="#a15c3e" font-weight="600">diseconomies</text>
  <text x="450" y="195" text-anchor="middle" font-size="11" fill="#a15c3e" font-weight="600">of scale</text>
</svg>
