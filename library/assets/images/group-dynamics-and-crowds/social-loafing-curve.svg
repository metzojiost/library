<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="240" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Effort per Person, by Group Size</text>

  <line x1="70" y1="200" x2="500" y2="200" stroke="#8a7f6a" stroke-width="1.5"/>
  <line x1="70" y1="200" x2="70" y2="60" stroke="#8a7f6a" stroke-width="1.5"/>

  <path d="M 90 90 Q 200 130, 300 155 T 470 180" stroke="#a15c3e" stroke-width="2.5" fill="none"/>
  <circle cx="90" cy="90" r="4" fill="#a15c3e"/>
  <circle cx="300" cy="155" r="4" fill="#a15c3e"/>
  <circle cx="470" cy="180" r="4" fill="#a15c3e"/>

  <text x="90" y="215" text-anchor="middle" font-size="10" fill="#5c5648">alone</text>
  <text x="470" y="215" text-anchor="middle" font-size="10" fill="#5c5648">large group</text>

  <text x="280" y="235" text-anchor="middle" font-size="10" fill="#8a7f6a">Individual effort declined even with real coordination problems ruled out.</text>
