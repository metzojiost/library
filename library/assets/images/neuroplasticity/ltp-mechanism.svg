<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="220" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Long-Term Potentiation</text>

  <circle cx="120" cy="110" r="26" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="120" y="114" text-anchor="middle" font-size="9" fill="#2b2620" font-weight="600">Neuron A</text>
  <path d="M 146 110 L 190 110" stroke="#8a7f6a" stroke-width="1.5"/>
  <circle cx="215" cy="110" r="26" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="215" y="114" text-anchor="middle" font-size="9" fill="#2b2620" font-weight="600">Neuron B</text>
  <text x="167" y="95" text-anchor="middle" font-size="8" fill="#5c5648">weak synapse</text>

  <text x="280" y="115" text-anchor="middle" font-size="18" fill="#a15c3e">→</text>

  <circle cx="380" cy="110" r="26" fill="#a15c3e" opacity="0.2" stroke="#a15c3e"/>
  <text x="380" y="114" text-anchor="middle" font-size="9" fill="#2b2620" font-weight="600">Neuron A</text>
  <path d="M 406 110 L 460 110" stroke="#a15c3e" stroke-width="3.5"/>
  <circle cx="485" cy="110" r="26" fill="#a15c3e" opacity="0.2" stroke="#a15c3e"/>
  <text x="485" y="114" text-anchor="middle" font-size="9" fill="#2b2620" font-weight="600">Neuron B</text>
  <text x="432" y="95" text-anchor="middle" font-size="8" fill="#a15c3e" font-weight="600">strengthened</text>

  <text x="280" y="180" text-anchor="middle" font-size="10" fill="#8a7f6a">Repeated, closely-timed stimulation → a lasting, measurable strengthening.</text>
</svg>
