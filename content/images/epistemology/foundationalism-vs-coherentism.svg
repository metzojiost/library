<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="280" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">Two Answers to the Regress</text>

  <text x="140" y="55" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Foundationalism</text>
  <path d="M 140 200 L 90 130 L 190 130 Z" fill="#f1e3d8" stroke="#e6ddd0"/>
  <line x1="105" y1="165" x2="175" y2="165" stroke="#e6ddd0"/>
  <rect x="70" y="200" width="140" height="20" fill="#a15c3e" opacity="0.3"/>
  <text x="140" y="235" text-anchor="middle" font-size="10" fill="#5c5648">basic beliefs (the floor)</text>

  <text x="420" y="55" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Coherentism</text>
  <circle cx="390" cy="110" r="8" fill="#a15c3e"/>
  <circle cx="450" cy="110" r="8" fill="#a15c3e"/>
  <circle cx="420" cy="150" r="8" fill="#a15c3e"/>
  <circle cx="380" cy="180" r="8" fill="#a15c3e"/>
  <circle cx="460" cy="180" r="8" fill="#a15c3e"/>
  <line x1="390" y1="110" x2="450" y2="110" stroke="#8a7f6a"/>
  <line x1="390" y1="110" x2="420" y2="150" stroke="#8a7f6a"/>
  <line x1="450" y1="110" x2="420" y2="150" stroke="#8a7f6a"/>
  <line x1="420" y1="150" x2="380" y2="180" stroke="#8a7f6a"/>
  <line x1="420" y1="150" x2="460" y2="180" stroke="#8a7f6a"/>
  <line x1="380" y1="180" x2="460" y2="180" stroke="#8a7f6a"/>
  <text x="420" y="235" text-anchor="middle" font-size="10" fill="#5c5648">a mutually supporting web</text>

  <text x="280" y="265" text-anchor="middle" font-size="11" fill="#8a7f6a">A staircase that has to stop somewhere, versus a web with no single foundation.</text>
</svg>
