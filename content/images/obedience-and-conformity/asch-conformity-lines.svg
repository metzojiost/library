<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">The Asch Line Task</text>

  <line x1="70" y1="60" x2="70" y2="130" stroke="#2b2620" stroke-width="3"/>
  <text x="70" y="145" text-anchor="middle" font-size="10" fill="#5c5648">reference</text>

  <line x1="160" y1="70" x2="160" y2="115" stroke="#8a7f6a" stroke-width="3"/>
  <text x="160" y="130" text-anchor="middle" font-size="10" fill="#5c5648">A</text>
  <line x1="220" y1="60" x2="220" y2="130" stroke="#a15c3e" stroke-width="3"/>
  <text x="220" y="145" text-anchor="middle" font-size="10" fill="#a15c3e" font-weight="600">B (correct)</text>
  <line x1="280" y1="75" x2="280" y2="108" stroke="#8a7f6a" stroke-width="3"/>
  <text x="280" y="125" text-anchor="middle" font-size="10" fill="#5c5648">C</text>

  <rect x="340" y="60" width="180" height="140" fill="none" stroke="#e6ddd0"/>
  <rect x="355" y="175" width="55" height="20" fill="#a15c3e" opacity="0.5"/>
  <text x="382" y="215" text-anchor="middle" font-size="9" fill="#5c5648">alone: ~0% error</text>
  <rect x="425" y="90" width="55" height="105" fill="#a15c3e" opacity="0.5"/>
  <text x="452" y="215" text-anchor="middle" font-size="9" fill="#5c5648">group: ~33% conform</text>

  <text x="280" y="240" text-anchor="middle" font-size="11" fill="#8a7f6a">An unambiguous task — still bent by a unanimous, wrong group answer.</text>
</svg>
