<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="240" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Shared Core, Local Content</text>

  <circle cx="280" cy="130" r="60" fill="#a15c3e" opacity="0.18" stroke="#a15c3e"/>
  <text x="280" y="120" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">separation,</text>
  <text x="280" y="136" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">transition, peace</text>

  <text x="100" y="75" text-anchor="middle" font-size="9" fill="#5c5648">named deity</text>
  <text x="460" y="75" text-anchor="middle" font-size="9" fill="#5c5648">vague "being of light"</text>
  <text x="100" y="195" text-anchor="middle" font-size="9" fill="#5c5648">crossing a river</text>
  <text x="460" y="195" text-anchor="middle" font-size="9" fill="#5c5648">a tunnel</text>

  <text x="280" y="230" text-anchor="middle" font-size="10" fill="#8a7f6a">The structure repeats; the specific symbols vary by culture.</text>
</svg>
