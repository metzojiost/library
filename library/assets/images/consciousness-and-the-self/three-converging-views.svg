  <text x="465" y="124" text-anchor="middle" font-size="9" fill="#5c5648">modern neuroscience</text>

  <path d="M 95 150 L 280 190" stroke="#8a7f6a" stroke-width="1.5"/>
  <path d="M 280 150 L 280 190" stroke="#8a7f6a" stroke-width="1.5"/>
  <path d="M 465 150 L 280 190" stroke="#8a7f6a" stroke-width="1.5"/>

  <rect x="180" y="190" width="200" height="35" rx="8" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="280" y="212" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">self as ongoing process</text>
