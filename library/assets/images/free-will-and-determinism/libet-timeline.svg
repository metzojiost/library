<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">The Libet Timeline</text>

  <line x1="60" y1="150" x2="500" y2="150" stroke="#8a7f6a" stroke-width="1.5"/>

  <circle cx="120" cy="150" r="6" fill="#a15c3e"/>
  <text x="120" y="130" text-anchor="middle" font-size="11" fill="#a15c3e" font-weight="600">readiness potential</text>
  <text x="120" y="175" text-anchor="middle" font-size="11" fill="#5c5648">~ -400ms</text>

  <circle cx="300" cy="150" r="6" fill="#2b2620"/>
  <text x="300" y="130" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">reported awareness</text>
  <text x="300" y="175" text-anchor="middle" font-size="11" fill="#5c5648">~ -200ms</text>

  <circle cx="460" cy="150" r="6" fill="#2b2620"/>
  <text x="460" y="130" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">wrist moves</text>
  <text x="460" y="175" text-anchor="middle" font-size="11" fill="#5c5648">0ms</text>

  <rect x="120" y="145" width="180" height="10" fill="#a15c3e" opacity="0.25"/>

  <text x="280" y="215" text-anchor="middle" font-size="12" fill="#8a7f6a">A ~200ms gap between the readiness potential and reported awareness —</text>
  <text x="280" y="232" text-anchor="middle" font-size="12" fill="#8a7f6a">what it means is the disputed part.</text>
</svg>
