<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">Two Routes to Responsibility</text>

  <rect x="40" y="55" width="220" height="140" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="150" y="80" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Traditional route</text>
  <text x="150" y="110" text-anchor="middle" font-size="11" fill="#5c5648">Requires proving</text>
  <text x="150" y="126" text-anchor="middle" font-size="11" fill="#5c5648">"could have done</text>
  <text x="150" y="142" text-anchor="middle" font-size="11" fill="#5c5648">otherwise" first</text>
  <text x="150" y="170" text-anchor="middle" font-size="11" fill="#a15c3e">stalls on determinism</text>

  <rect x="300" y="55" width="220" height="140" rx="10" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="410" y="80" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Strawson's route</text>
  <text x="410" y="110" text-anchor="middle" font-size="11" fill="#2b2620">Grounded directly in</text>
  <text x="410" y="126" text-anchor="middle" font-size="11" fill="#2b2620">reactive attitudes:</text>
  <text x="410" y="142" text-anchor="middle" font-size="11" fill="#2b2620">resentment, gratitude</text>
  <text x="410" y="170" text-anchor="middle" font-size="11" fill="#a15c3e" font-weight="600">bypasses the metaphysics</text>

  <text x="280" y="230" text-anchor="middle" font-size="12" fill="#8a7f6a">Same destination — responsibility — reached by a very different road.</text>
</svg>
