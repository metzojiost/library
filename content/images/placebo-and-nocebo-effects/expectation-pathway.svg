<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="340" fill="#ffffff"/>

  <defs>
    <marker id="arrow7" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a15c3e"/>
    </marker>
  </defs>

  <rect x="15" y="110" width="150" height="100" rx="12" fill="#f1e3d8" stroke="#a15c3e" stroke-width="2"/>
  <text x="90" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2620">Expectation</text>
  <text x="90" y="170" text-anchor="middle" font-size="11" fill="#5c5648">"this will help"</text>

  <rect x="205" y="110" width="150" height="100" rx="12" fill="#efe6d8" stroke="#5c5648" stroke-width="2"/>
  <text x="280" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2620">Opioid system</text>
  <text x="280" y="170" text-anchor="middle" font-size="11" fill="#5c5648">activates in the brain</text>

  <rect x="395" y="110" width="150" height="100" rx="12" fill="#e6ddd0" stroke="#8a7f6a" stroke-width="2"/>
  <text x="470" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2620">Real relief</text>
  <text x="470" y="170" text-anchor="middle" font-size="11" fill="#5c5648">measurable, not imagined</text>

  <line x1="165" y1="160" x2="205" y2="160" stroke="#a15c3e" stroke-width="2.5" marker-end="url(#arrow7)"/>
  <line x1="355" y1="160" x2="395" y2="160" stroke="#a15c3e" stroke-width="2.5" marker-end="url(#arrow7)"/>

  <text x="280" y="270" text-anchor="middle" font-size="12.5" fill="#8a7f6a" font-style="italic">Blocking the opioid system with a drug measurably weakens the placebo effect — real physiology, not "just belief."</text>
</svg>
