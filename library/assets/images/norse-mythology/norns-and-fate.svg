<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">The Norns Outrank Everyone</text>

  <rect x="180" y="50" width="200" height="50" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="280" y="80" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Odin and the gods</text>

  <path d="M 280 100 L 280 140" stroke="#8a7f6a" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#armH)"/>
  <text x="330" y="125" text-anchor="middle" font-size="10" fill="#5c5648">subject to</text>

  <rect x="150" y="145" width="260" height="70" rx="10" fill="#a15c3e" opacity="0.18" stroke="#a15c3e"/>
  <text x="280" y="175" text-anchor="middle" font-size="13" fill="#2b2620" font-weight="600">The Norns</text>
  <text x="280" y="195" text-anchor="middle" font-size="10" fill="#5c5648">weaving fate at the Well of Urd</text>

  <text x="280" y="240" text-anchor="middle" font-size="11" fill="#8a7f6a">Not even Odin, who traded an eye for wisdom, can unmake what they've set.</text>

  <defs>
    <marker id="armH" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a7f6a"/>
    </marker>
  </defs>
</svg>
