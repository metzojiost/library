<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="220" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">A Durable Cluster of Change</text>

  <rect x="30" y="55" width="120" height="60" rx="6" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="90" y="88" text-anchor="middle" font-size="9" fill="#2b2620" font-weight="600">reduced death anxiety</text>

  <rect x="165" y="55" width="120" height="60" rx="6" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="225" y="88" text-anchor="middle" font-size="9" fill="#2b2620" font-weight="600">shifted values</text>

  <rect x="300" y="55" width="120" height="60" rx="6" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="360" y="88" text-anchor="middle" font-size="9" fill="#2b2620" font-weight="600">personal spirituality</text>

  <rect x="435" y="55" width="100" height="60" rx="6" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="485" y="88" text-anchor="middle" font-size="9" fill="#2b2620" font-weight="600">compassion</text>

  <text x="280" y="150" text-anchor="middle" font-size="10" fill="#8a7f6a">Measurable years, sometimes decades, later — regardless of the causal debate.</text>
</svg>
