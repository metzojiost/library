<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="280" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">Split-Brain Routing</text>

  <rect x="60" y="60" width="180" height="90" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="150" y="90" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Left visual field</text>
  <text x="150" y="110" text-anchor="middle" font-size="11" fill="#5c5648">seen by patient</text>

  <rect x="320" y="60" width="180" height="90" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="410" y="90" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Right visual field</text>
  <text x="410" y="110" text-anchor="middle" font-size="11" fill="#5c5648">seen by patient</text>

  <path d="M 150 150 L 410 220" stroke="#a15c3e" stroke-width="2" fill="none" marker-end="url(#armA)"/>
  <path d="M 410 150 L 150 220" stroke="#a15c3e" stroke-width="2" fill="none" marker-end="url(#armA)"/>

  <rect x="60" y="215" width="180" height="45" rx="8" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="150" y="242" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Right hemisphere</text>

  <rect x="320" y="215" width="180" height="45" rx="8" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="410" y="242" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Left hemisphere</text>

  <line x1="270" y1="238" x2="290" y2="238" stroke="#8a7f6a" stroke-width="4"/>
  <line x1="280" y1="228" x2="280" y2="248" stroke="#ffffff" stroke-width="4"/>
  <text x="280" y="270" text-anchor="middle" font-size="10" fill="#8a7f6a">severed corpus callosum</text>

  <defs>
    <marker id="armA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#a15c3e"/>
    </marker>
  </defs>
</svg>
