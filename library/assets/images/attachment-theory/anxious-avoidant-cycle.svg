<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">The Anxious-Avoidant Loop</text>

  <circle cx="150" cy="130" r="55" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="150" y="125" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Anxious partner</text>
  <text x="150" y="143" text-anchor="middle" font-size="10" fill="#5c5648">escalates for closeness</text>

  <circle cx="410" cy="130" r="55" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="410" y="125" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Avoidant partner</text>
  <text x="410" y="143" text-anchor="middle" font-size="10" fill="#5c5648">withdraws under pressure</text>

  <path d="M 205 110 L 355 110" stroke="#8a7f6a" stroke-width="2" marker-end="url(#armJ)"/>
  <path d="M 355 150 L 205 150" stroke="#8a7f6a" stroke-width="2" marker-end="url(#armJ)"/>

  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#8a7f6a">Each response confirms the other partner's model — a loop, not a choice.</text>

  <defs>
    <marker id="armJ" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a7f6a"/>
    </marker>
  </defs>
</svg>
