<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="360" fill="#ffffff"/>

  <line x1="60" y1="280" x2="520" y2="280" stroke="#2b2620" stroke-width="1.5"/>

  <rect x="70" y="240" width="60" height="30" fill="#e6ddd0"/>
  <rect x="150" y="230" width="70" height="40" fill="#e6ddd0"/>
  <rect x="240" y="215" width="80" height="55" fill="#e6ddd0"/>
  <rect x="340" y="195" width="90" height="75" fill="#a15c3e"/>
  <rect x="450" y="175" width="60" height="95" fill="#a15c3e"/>

  <text x="100" y="230" text-anchor="middle" font-size="10" fill="#5c5648">REM</text>
  <text x="185" y="220" text-anchor="middle" font-size="10" fill="#5c5648">REM</text>
  <text x="280" y="205" text-anchor="middle" font-size="10" fill="#5c5648">REM</text>
  <text x="385" y="185" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">REM</text>
  <text x="480" y="165" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">REM</text>

  <rect x="330" y="80" width="180" height="30" fill="none" stroke="#a15c3e" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="420" y="70" text-anchor="middle" font-size="12" fill="#a15c3e" font-weight="bold">WBTB window (4.5-6 hrs in)</text>

  <text x="100" y="300" text-anchor="middle" font-size="11" fill="#8a7f6a">early night</text>
  <text x="480" y="300" text-anchor="middle" font-size="11" fill="#8a7f6a">late night</text>

  <text x="280" y="335" text-anchor="middle" font-size="12.5" fill="#8a7f6a" font-style="italic">REM periods lengthen across the night — WBTB deliberately targets that later, REM-dense stretch.</text>
</svg>
