<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="520" height="340" fill="#ffffff"/>

  <defs>
    <marker id="arrow6" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a15c3e"/>
    </marker>
  </defs>

  <rect x="20" y="110" width="180" height="100" rx="12" fill="#f1e3d8" stroke="#a15c3e" stroke-width="2"/>
  <text x="110" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2620">Suggestion given</text>
  <text x="110" y="170" text-anchor="middle" font-size="11" fill="#5c5648">"your hand feels numb"</text>

  <rect x="240" y="110" width="260" height="100" rx="12" fill="#efe6d8" stroke="#5c5648" stroke-width="2"/>
  <text x="370" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2620">Pain-processing regions</text>
  <text x="370" y="170" text-anchor="middle" font-size="11" fill="#5c5648">measurably less active</text>
  <text x="370" y="188" text-anchor="middle" font-size="11" fill="#5c5648">when the hand is pricked</text>

  <line x1="200" y1="160" x2="240" y2="160" stroke="#a15c3e" stroke-width="2.5" marker-end="url(#arrow6)"/>

  <text x="260" y="270" text-anchor="middle" font-size="12.5" fill="#8a7f6a" font-style="italic">No general "trance state" needed — a specific suggestion produces a specific, measurable brain change.</text>
</svg>
