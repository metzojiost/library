<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="240" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">A Fine Doesn't Add — It Replaces</text>

  <rect x="40" y="55" width="220" height="90" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="150" y="85" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Before: social norm</text>
  <text x="150" y="110" text-anchor="middle" font-size="10" fill="#5c5648">consideration for staff</text>

  <path d="M 280 100 L 300 100" stroke="#8a7f6a" stroke-width="2" marker-end="url(#armN)"/>

  <rect x="300" y="55" width="220" height="90" rx="10" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="410" y="85" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">After: priced transaction</text>
  <text x="410" y="110" text-anchor="middle" font-size="10" fill="#5c5648">pay the fee, lose the guilt</text>

  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#8a7f6a">Removing the fine later didn't restore the original norm — it stayed replaced.</text>

  <defs>
    <marker id="armN" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a7f6a"/>
    </marker>
  </defs>
</svg>
