<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="520" height="320" fill="#ffffff"/>

  <rect x="30" y="40" width="220" height="70" rx="10" fill="#f1e3d8" stroke="#a15c3e" stroke-width="2"/>
  <text x="140" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">Risky prediction</text>
  <text x="140" y="90" text-anchor="middle" font-size="11" fill="#5c5648">"I am awake"</text>

  <rect x="270" y="40" width="220" height="70" rx="10" fill="#efe6d8" stroke="#5c5648" stroke-width="2"/>
  <text x="380" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">Genuine test</text>
  <text x="380" y="90" text-anchor="middle" font-size="11" fill="#5c5648">try to fail the reality check</text>

  <rect x="30" y="180" width="220" height="90" rx="10" fill="#e0d5c5" stroke="#8a7f6a" stroke-width="2"/>
  <text x="140" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">Survives</text>
  <text x="140" y="235" text-anchor="middle" font-size="11" fill="#5c5648">check passes as expected</text>
  <text x="140" y="252" text-anchor="middle" font-size="11" fill="#5c5648">(usually: you're awake)</text>

  <rect x="270" y="180" width="220" height="90" rx="10" fill="#a15c3e"/>
  <text x="380" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Fails</text>
  <text x="380" y="235" text-anchor="middle" font-size="11" fill="#fff">check breaks unexpectedly</text>
  <text x="380" y="252" text-anchor="middle" font-size="11" fill="#fff">(you were dreaming)</text>

  <text x="260" y="300" text-anchor="middle" font-size="12.5" fill="#8a7f6a" font-style="italic">Structurally identical to Popper's falsification test — a specific claim that could fail, and sometimes does.</text>
</svg>
