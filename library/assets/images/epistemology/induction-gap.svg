<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="220" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">The Gap Induction Has to Jump</text>

  <circle cx="80" cy="110" r="18" fill="#f1e3d8" stroke="#e6ddd0"/>
  <circle cx="140" cy="110" r="18" fill="#f1e3d8" stroke="#e6ddd0"/>
  <circle cx="200" cy="110" r="18" fill="#f1e3d8" stroke="#e6ddd0"/>
  <circle cx="260" cy="110" r="18" fill="#f1e3d8" stroke="#e6ddd0"/>
  <circle cx="320" cy="110" r="18" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="200" y="150" text-anchor="middle" font-size="11" fill="#5c5648">every past sunrise, observed</text>

  <line x1="345" y1="110" x2="395" y2="110" stroke="#8a7f6a" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="370" y="95" text-anchor="middle" font-size="10" fill="#8a7f6a">no logical bridge</text>

  <circle cx="440" cy="110" r="22" fill="#a15c3e" opacity="0.15" stroke="#a15c3e" stroke-dasharray="3,3"/>
  <text x="440" y="115" text-anchor="middle" font-size="16" fill="#a15c3e" font-weight="600">?</text>
  <text x="440" y="150" text-anchor="middle" font-size="11" fill="#a15c3e" font-weight="600">tomorrow's sunrise</text>

  <text x="280" y="195" text-anchor="middle" font-size="11" fill="#8a7f6a">Any number of past cases doesn't logically prove the next one.</text>
</svg>
