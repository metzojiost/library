<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="260" fill="#ffffff"/>

  <line x1="60" y1="140" x2="500" y2="140" stroke="#2b2620" stroke-width="2"/>

  <circle cx="110" cy="140" r="9" fill="#a15c3e"/>
  <text x="110" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2620">~11th century</text>
  <text x="110" y="170" text-anchor="middle" font-size="12" fill="#5c5648">Dream yoga formalized</text>
  <text x="110" y="186" text-anchor="middle" font-size="12" fill="#5c5648">(Six Yogas of Naropa)</text>

  <circle cx="450" cy="140" r="9" fill="#a15c3e"/>
  <text x="450" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2620">1975</text>
  <text x="450" y="170" text-anchor="middle" font-size="12" fill="#5c5648">First EEG-confirmed</text>
  <text x="450" y="186" text-anchor="middle" font-size="12" fill="#5c5648">signal from a dream</text>

  <text x="280" y="230" text-anchor="middle" font-size="12.5" fill="#8a7f6a" font-style="italic">Roughly 900 years between the same trainable skill being documented, and being measured.</text>
</svg>
