<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">Information Asymmetry</text>

  <circle cx="140" cy="140" r="55" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="140" y="135" text-anchor="middle" font-size="13" fill="#2b2620" font-weight="600">Party A</text>
  <text x="140" y="153" text-anchor="middle" font-size="11" fill="#5c5648">knows more</text>

  <circle cx="420" cy="140" r="55" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="420" y="135" text-anchor="middle" font-size="13" fill="#2b2620" font-weight="600">Party B</text>
  <text x="420" y="153" text-anchor="middle" font-size="11" fill="#5c5648">knows less</text>

  <line x1="200" y1="140" x2="360" y2="140" stroke="#a15c3e" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#a15c3e"/>
    </marker>
  </defs>
  <text x="280" y="125" text-anchor="middle" font-size="11" fill="#a15c3e">leverage</text>

  <text x="280" y="230" text-anchor="middle" font-size="12" fill="#8a7f6a">The better-informed party negotiates from a structurally stronger position.</text>
</svg>
