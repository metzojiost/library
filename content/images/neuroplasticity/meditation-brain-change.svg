<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="220" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">8 Weeks of Mindfulness Training</text>

  <rect x="60" y="60" width="200" height="110" rx="8" fill="#a15c3e" opacity="0.18" stroke="#a15c3e"/>
  <text x="160" y="85" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Hippocampus</text>
  <path d="M 160 100 L 160 130" stroke="#a15c3e" stroke-width="2" marker-end="url(#armM)"/>
  <text x="160" y="150" text-anchor="middle" font-size="10" fill="#a15c3e" font-weight="700">Gray matter ↑</text>

  <rect x="300" y="60" width="200" height="110" rx="8" fill="#8a7f6a" opacity="0.15" stroke="#8a7f6a"/>
  <text x="400" y="85" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Amygdala</text>
  <path d="M 400 100 L 400 130" stroke="#8a7f6a" stroke-width="2" marker-end="url(#armMdown)"/>
  <text x="400" y="150" text-anchor="middle" font-size="10" fill="#5c5648" font-weight="700">Gray matter ↓</text>

  <text x="280" y="200" text-anchor="middle" font-size="10" fill="#8a7f6a">Structural change, from a realistic, standardized 8-week program.</text>

  <defs>
    <marker id="armM" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,8 L10,8 L5,0 z" fill="#a15c3e"/>
    </marker>
    <marker id="armMdown" markerWidth="10" markerHeight="10" refX="5" refY="0" orient="auto">
      <path d="M0,0 L10,0 L5,8 z" fill="#8a7f6a"/>
    </marker>
  </defs>
</svg>
