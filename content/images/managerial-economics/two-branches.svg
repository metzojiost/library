<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">Two Branches of Economics</text>

  <rect x="30" y="60" width="230" height="150" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="145" y="90" text-anchor="middle" font-size="14" fill="#2b2620" font-weight="600">Market Economics</text>
  <text x="145" y="120" text-anchor="middle" font-size="12" fill="#5c5648">Many competing actors</text>
  <text x="145" y="140" text-anchor="middle" font-size="12" fill="#5c5648">Predicts prices,</text>
  <text x="145" y="158" text-anchor="middle" font-size="12" fill="#5c5648">equilibrium, behavior</text>

  <rect x="300" y="60" width="230" height="150" rx="10" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="415" y="90" text-anchor="middle" font-size="14" fill="#2b2620" font-weight="600">Managerial Economics</text>
  <text x="415" y="120" text-anchor="middle" font-size="12" fill="#5c5648">One decision-maker</text>
  <text x="415" y="140" text-anchor="middle" font-size="12" fill="#5c5648">Decision tools:</text>
  <text x="415" y="158" text-anchor="middle" font-size="12" fill="#5c5648">what should I do?</text>

  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#8a7f6a">Same underlying logic (opportunity cost, marginal analysis), aimed inward instead of at the market.</text>
</svg>
