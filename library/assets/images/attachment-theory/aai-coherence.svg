<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="240" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Not the Story, the Telling</text>

  <rect x="30" y="55" width="240" height="130" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="150" y="80" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">What happened</text>
  <text x="150" y="110" text-anchor="middle" font-size="10" fill="#5c5648">easy or difficult childhood</text>
  <text x="150" y="150" text-anchor="middle" font-size="10" fill="#8a7f6a">weaker predictor</text>

  <rect x="300" y="55" width="240" height="130" rx="10" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="420" y="80" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">How it's narrated</text>
  <text x="420" y="110" text-anchor="middle" font-size="10" fill="#5c5648">coherent vs. fragmented</text>
  <text x="420" y="150" text-anchor="middle" font-size="10" fill="#a15c3e" font-weight="600">what the AAI actually scores</text>

  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#8a7f6a">A hard childhood, coherently told, can still classify as earned secure.</text>
</svg>
