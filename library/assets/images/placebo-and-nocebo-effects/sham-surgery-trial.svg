<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="230" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Knee Osteoarthritis: Three Arms, One Outcome</text>

  <rect x="45" y="60" width="145" height="110" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="117" y="88" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Real arthroscopic</text>
  <text x="117" y="102" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">surgery</text>
  <text x="117" y="145" text-anchor="middle" font-size="12" fill="#a15c3e" font-weight="700">Improved</text>

  <rect x="207" y="60" width="145" height="110" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="279" y="88" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Lavage-only</text>
  <text x="279" y="102" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">surgery</text>
  <text x="279" y="145" text-anchor="middle" font-size="12" fill="#a15c3e" font-weight="700">Improved</text>

  <rect x="369" y="60" width="145" height="110" rx="8" fill="#a15c3e" opacity="0.18" stroke="#a15c3e"/>
  <text x="441" y="88" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Sham surgery</text>
  <text x="441" y="102" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">(no joint work)</text>
  <text x="441" y="145" text-anchor="middle" font-size="12" fill="#a15c3e" font-weight="700">Improved</text>

  <text x="280" y="200" text-anchor="middle" font-size="10" fill="#8a7f6a">At two years: statistically indistinguishable pain and function outcomes across all three arms.</text>
</svg>
