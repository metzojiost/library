<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="280" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">One Order, Two Judgments</text>

  <rect x="40" y="60" width="220" height="150" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="150" y="90" text-anchor="middle" font-size="14" fill="#2b2620" font-weight="600">By average cost</text>
  <text x="150" y="120" text-anchor="middle" font-size="12" fill="#5c5648">includes $10,000</text>
  <text x="150" y="138" text-anchor="middle" font-size="12" fill="#5c5648">already-spent setup</text>
  <text x="150" y="170" text-anchor="middle" font-size="16" fill="#a15c3e" font-weight="700">looks like a loss</text>

  <rect x="300" y="60" width="220" height="150" rx="10" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="410" y="90" text-anchor="middle" font-size="14" fill="#2b2620" font-weight="600">By marginal cost</text>
  <text x="410" y="120" text-anchor="middle" font-size="12" fill="#5c5648">$500 cost vs.</text>
  <text x="410" y="138" text-anchor="middle" font-size="12" fill="#5c5648">$600 revenue, this order only</text>
  <text x="410" y="170" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="700">real +$100 gain</text>

  <text x="280" y="245" text-anchor="middle" font-size="12" fill="#8a7f6a">Sunk fixed costs belong in neither number — only the marginal comparison is correct.</text>
</svg>
