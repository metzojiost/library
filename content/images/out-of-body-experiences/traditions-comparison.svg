<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="220" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Independently Arrived At</text>

  <rect x="30" y="60" width="150" height="80" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="105" y="90" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Theosophy</text>
  <text x="105" y="108" text-anchor="middle" font-size="9" fill="#5c5648">astral body, silver cord</text>

  <rect x="205" y="60" width="150" height="80" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="280" y="90" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Tibetan Buddhism</text>
  <text x="280" y="108" text-anchor="middle" font-size="9" fill="#5c5648">bardo states</text>

  <rect x="380" y="60" width="150" height="80" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="455" y="90" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Shamanic traditions</text>
  <text x="455" y="108" text-anchor="middle" font-size="9" fill="#5c5648">soul flight</text>

  <text x="280" y="175" text-anchor="middle" font-size="10" fill="#8a7f6a">No direct contact between them — a shared experience, differently theorized.</text>
</svg>
