<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="500" height="380" fill="#ffffff"/>
  <text x="250" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">Ordinary Skills, Rare Combination</text>

  <circle cx="200" cy="200" r="110" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <circle cx="300" cy="200" r="110" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <circle cx="250" cy="120" r="110" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>

  <text x="150" y="255" text-anchor="middle" font-size="13" fill="#5c5648">Writing</text>
  <text x="345" y="255" text-anchor="middle" font-size="13" fill="#5c5648">Coding</text>
  <text x="250" y="75" text-anchor="middle" font-size="13" fill="#5c5648">Industry</text>
