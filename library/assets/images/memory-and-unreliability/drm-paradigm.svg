<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">The DRM Paradigm</text>

  <text x="100" y="70" font-size="11" fill="#5c5648">bed</text>
  <text x="160" y="60" font-size="11" fill="#5c5648">rest</text>
  <text x="230" y="70" font-size="11" fill="#5c5648">tired</text>
  <text x="300" y="60" font-size="11" fill="#5c5648">awake</text>
  <text x="380" y="70" font-size="11" fill="#5c5648">dream</text>
  <text x="450" y="60" font-size="11" fill="#5c5648">nap</text>

  <circle cx="280" cy="150" r="55" fill="#a15c3e" opacity="0.15" stroke="#a15c3e" stroke-dasharray="4,3"/>
  <text x="280" y="146" text-anchor="middle" font-size="14" fill="#a15c3e" font-weight="600">"sleep"</text>
  <text x="280" y="164" text-anchor="middle" font-size="9" fill="#a15c3e">never presented</text>

  <path d="M 130 80 L 245 130" stroke="#8a7f6a" stroke-width="1"/>
  <path d="M 180 70 L 260 105" stroke="#8a7f6a" stroke-width="1"/>
  <path d="M 250 80 L 275 100" stroke="#8a7f6a" stroke-width="1"/>
  <path d="M 320 70 L 290 105" stroke="#8a7f6a" stroke-width="1"/>
  <path d="M 400 80 L 305 130" stroke="#8a7f6a" stroke-width="1"/>
  <path d="M 460 70 L 320 145" stroke="#8a7f6a" stroke-width="1"/>

  <text x="280" y="235" text-anchor="middle" font-size="11" fill="#8a7f6a">Most participants later swear, confidently, that they heard "sleep."</text>
</svg>
