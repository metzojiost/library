<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="240" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">One Mechanism, Many Names</text>

  <rect x="30" y="55" width="220" height="90" rx="8" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="140" y="80" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">REM paralysis persists</text>
  <text x="140" y="96" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">into waking awareness</text>
  <text x="140" y="120" text-anchor="middle" font-size="10" fill="#a15c3e" font-weight="600">+ intruding hallucination</text>

  <path d="M 255 100 L 300 100" stroke="#8a7f6a" stroke-width="2" marker-end="url(#armS)"/>

  <rect x="305" y="55" width="225" height="90" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="417" y="80" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">night hag / incubus /</text>
  <text x="417" y="96" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">alien visitor / named spirit</text>
  <text x="417" y="120" text-anchor="middle" font-size="10" fill="#5c5648">— culturally supplied</text>

  <text x="280" y="180" text-anchor="middle" font-size="10" fill="#8a7f6a">Same physiology worldwide — the explanation offered depends on the culture.</text>

  <defs>
    <marker id="armS" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a7f6a"/>
    </marker>
  </defs>
</svg>
