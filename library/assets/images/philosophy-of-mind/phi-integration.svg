<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">Integration, Not Just Size</text>

  <rect x="40" y="55" width="220" height="150" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="150" y="78" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Many small clusters</text>
  <circle cx="90" cy="110" r="10" fill="#8a7f6a"/><circle cx="120" cy="110" r="10" fill="#8a7f6a"/>
  <line x1="90" y1="110" x2="120" y2="110" stroke="#8a7f6a" stroke-width="2"/>
  <circle cx="170" cy="110" r="10" fill="#8a7f6a"/><circle cx="200" cy="110" r="10" fill="#8a7f6a"/>
  <line x1="170" y1="110" x2="200" y2="110" stroke="#8a7f6a" stroke-width="2"/>
  <circle cx="90" cy="160" r="10" fill="#8a7f6a"/><circle cx="120" cy="160" r="10" fill="#8a7f6a"/>
  <line x1="90" y1="160" x2="120" y2="160" stroke="#8a7f6a" stroke-width="2"/>
  <circle cx="170" cy="160" r="10" fill="#8a7f6a"/><circle cx="200" cy="160" r="10" fill="#8a7f6a"/>
  <line x1="170" y1="160" x2="200" y2="160" stroke="#8a7f6a" stroke-width="2"/>
  <text x="150" y="230" text-anchor="middle" font-size="11" fill="#5c5648">low &#934; — low integration</text>

  <rect x="300" y="55" width="220" height="150" rx="10" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="410" y="78" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Densely interconnected</text>
  <circle cx="360" cy="110" r="10" fill="#a15c3e"/><circle cx="410" cy="105" r="10" fill="#a15c3e"/>
  <circle cx="460" cy="110" r="10" fill="#a15c3e"/><circle cx="380" cy="160" r="10" fill="#a15c3e"/>
  <circle cx="440" cy="160" r="10" fill="#a15c3e"/>
  <line x1="360" y1="110" x2="410" y2="105" stroke="#a15c3e" stroke-width="1.5"/>
  <line x1="410" y1="105" x2="460" y2="110" stroke="#a15c3e" stroke-width="1.5"/>
  <line x1="360" y1="110" x2="380" y2="160" stroke="#a15c3e" stroke-width="1.5"/>
  <line x1="460" y1="110" x2="440" y2="160" stroke="#a15c3e" stroke-width="1.5"/>
  <line x1="380" y1="160" x2="440" y2="160" stroke="#a15c3e" stroke-width="1.5"/>
  <line x1="410" y1="105" x2="380" y2="160" stroke="#a15c3e" stroke-width="1.5"/>
  <line x1="410" y1="105" x2="440" y2="160" stroke="#a15c3e" stroke-width="1.5"/>
  <text x="410" y="230" text-anchor="middle" font-size="11" fill="#a15c3e" font-weight="600">high &#934; — high integration</text>
</svg>
