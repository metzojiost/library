<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="480" height="360" fill="#ffffff"/>

  <line x1="90" y1="300" x2="420" y2="300" stroke="#2b2620" stroke-width="1.5"/>
  <line x1="90" y1="300" x2="90" y2="50" stroke="#2b2620" stroke-width="1.5"/>

  <rect x="150" y="240" width="80" height="60" fill="#8a7f6a"/>
  <text x="190" y="230" text-anchor="middle" font-size="12" fill="#5c5648" font-weight="bold">low</text>
  <text x="190" y="322" text-anchor="middle" font-size="11" fill="#2b2620">Ordinary REM</text>

  <rect x="290" y="90" width="80" height="210" fill="#a15c3e"/>
  <text x="330" y="80" text-anchor="middle" font-size="12" fill="#a15c3e" font-weight="bold">elevated</text>
  <text x="330" y="322" text-anchor="middle" font-size="11" fill="#2b2620">Lucid REM</text>

  <text x="70" y="55" text-anchor="end" font-size="10.5" fill="#8a7f6a">high</text>
  <text x="70" y="300" text-anchor="end" font-size="10.5" fill="#8a7f6a">low</text>

  <text x="255" y="30" text-anchor="middle" font-size="12" fill="#2b2620">dorsolateral prefrontal cortex activity</text>
  <text x="255" y="345" text-anchor="middle" font-size="12.5" fill="#8a7f6a" font-style="italic">The self-reflective region that's normally quiet during REM reactivates during lucidity.</text>
</svg>
