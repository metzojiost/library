<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="540" height="360" fill="#ffffff"/>

  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a15c3e"/>
    </marker>
  </defs>

  <rect x="30" y="120" width="160" height="100" rx="12" fill="#f1e3d8" stroke="#a15c3e" stroke-width="2"/>
  <text x="110" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2620">Dreamer</text>
  <text x="110" y="180" text-anchor="middle" font-size="11" fill="#5c5648">lucid, in REM sleep</text>
  <text x="110" y="198" text-anchor="middle" font-size="11" fill="#5c5648">moves eyes: L-R-L-R</text>

  <rect x="220" y="120" width="140" height="100" rx="12" fill="#efe6d8" stroke="#5c5648" stroke-width="2"/>
  <text x="290" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2620">EEG</text>
  <text x="290" y="180" text-anchor="middle" font-size="11" fill="#5c5648">detects the eye</text>
  <text x="290" y="198" text-anchor="middle" font-size="11" fill="#5c5648">movement signal</text>

  <rect x="390" y="120" width="130" height="100" rx="12" fill="#e6ddd0" stroke="#8a7f6a" stroke-width="2"/>
  <text x="455" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2620">Researcher</text>
  <text x="455" y="180" text-anchor="middle" font-size="11" fill="#5c5648">confirms lucidity</text>
  <text x="455" y="198" text-anchor="middle" font-size="11" fill="#5c5648">in real time</text>

  <line x1="190" y1="170" x2="220" y2="170" stroke="#a15c3e" stroke-width="2.5" marker-end="url(#arrow5)"/>
  <line x1="360" y1="170" x2="390" y2="170" stroke="#a15c3e" stroke-width="2.5" marker-end="url(#arrow5)"/>

  <text x="270" y="280" text-anchor="middle" font-size="12.5" fill="#8a7f6a" font-style="italic">A prearranged eye-movement code, sent from inside a dream — confirmed externally for the first time in 1975.</text>
</svg>
