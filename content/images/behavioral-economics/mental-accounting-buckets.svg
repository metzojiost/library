<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="340" fill="#ffffff"/>

  <g>
    <rect x="20" y="140" width="110" height="130" rx="8" fill="#f1e3d8" stroke="#a15c3e" stroke-width="2"/>
    <text x="75" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">Rent</text>
  </g>
  <g>
    <rect x="150" y="120" width="110" height="150" rx="8" fill="#efe6d8" stroke="#5c5648" stroke-width="2"/>
    <text x="205" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">Savings</text>
  </g>
  <g>
    <rect x="280" y="160" width="110" height="110" rx="8" fill="#e6ddd0" stroke="#8a7f6a" stroke-width="2"/>
    <text x="335" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">Fun money</text>
  </g>
  <g>
    <rect x="410" y="100" width="130" height="170" rx="8" fill="#e0c4ab" stroke="#a15c3e" stroke-width="2"/>
    <text x="475" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">Windfall</text>
  </g>

  <text x="75" y="215" text-anchor="middle" font-size="11" fill="#5c5648">$</text>
  <text x="205" y="205" text-anchor="middle" font-size="11" fill="#5c5648">$</text>
  <text x="335" y="220" text-anchor="middle" font-size="11" fill="#5c5648">$</text>
  <text x="475" y="195" text-anchor="middle" font-size="11" fill="#5c5648">$</text>

  <text x="280" y="310" text-anchor="middle" font-size="12.5" fill="#8a7f6a" font-style="italic">All identical, fungible dollars — treated by the brain as if they lived in separate, non-interchangeable buckets.</text>
</svg>
