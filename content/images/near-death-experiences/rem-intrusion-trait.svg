<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="220" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">A Confirmed Prediction</text>

  <rect x="60" y="55" width="200" height="70" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="160" y="85" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Higher lifetime REM</text>
  <text x="160" y="101" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">intrusion / sleep paralysis</text>

  <path d="M 265 90 L 300 90" stroke="#8a7f6a" stroke-width="2" marker-end="url(#armT)"/>

  <rect x="305" y="55" width="200" height="70" rx="8" fill="#a15c3e" opacity="0.18" stroke="#a15c3e"/>
  <text x="405" y="85" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">More likely to report</text>
  <text x="405" y="101" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">a near-death experience</text>

  <text x="280" y="170" text-anchor="middle" font-size="10" fill="#8a7f6a">Predicted in advance, then confirmed — stronger than after-the-fact explanation.</text>

  <defs>
    <marker id="armT" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a7f6a"/>
    </marker>
  </defs>
</svg>
