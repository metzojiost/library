<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">The Boundary of a Firm</text>

  <rect x="230" y="55" width="140" height="170" rx="10" fill="#a15c3e" opacity="0.15" stroke="#a15c3e" stroke-width="2"/>
  <text x="300" y="80" text-anchor="middle" font-size="12" fill="#a15c3e" font-weight="600">INSIDE THE FIRM</text>

  <text x="120" y="90" text-anchor="middle" font-size="12" fill="#2b2620">One-off task</text>
  <text x="120" y="108" text-anchor="middle" font-size="11" fill="#5c5648">low transaction cost</text>
  <text x="120" y="130" text-anchor="middle" font-size="13" fill="#5c5648" font-weight="600">→ contract it out</text>

  <text x="470" y="90" text-anchor="middle" font-size="12" fill="#2b2620">Recurring need</text>
  <text x="470" y="108" text-anchor="middle" font-size="11" fill="#5c5648">high repeated cost</text>
  <text x="470" y="130" text-anchor="middle" font-size="13" fill="#a15c3e" font-weight="600">→ bring in-house</text>

  <text x="280" y="245" text-anchor="middle" font-size="12" fill="#8a7f6a">The line moves based on transaction costs, not the raw price of the task.</text>
</svg>
