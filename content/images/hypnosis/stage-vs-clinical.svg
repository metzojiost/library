<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="250" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Same Trait, Different Settings</text>

  <rect x="50" y="55" width="210" height="150" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="155" y="80" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">Clinical hypnosis</text>
  <text x="155" y="105" text-anchor="middle" font-size="9" fill="#5c5648">Genuine susceptibility</text>
  <text x="155" y="122" text-anchor="middle" font-size="9" fill="#5c5648">Private, low-pressure</text>
  <text x="155" y="139" text-anchor="middle" font-size="9" fill="#5c5648">No audience, no script</text>
  <text x="155" y="156" text-anchor="middle" font-size="9" fill="#5c5648">to perform for</text>

  <rect x="300" y="55" width="210" height="150" rx="8" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="405" y="80" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">Stage hypnosis</text>
  <text x="405" y="105" text-anchor="middle" font-size="9" fill="#5c5648">Genuine susceptibility +</text>
  <text x="405" y="122" text-anchor="middle" font-size="9" fill="#5c5648">Pre-show selection</text>
  <text x="405" y="139" text-anchor="middle" font-size="9" fill="#5c5648">Social compliance</text>
  <text x="405" y="156" text-anchor="middle" font-size="9" fill="#5c5648">Low-refusal-cost suggestions</text>

  <text x="280" y="230" text-anchor="middle" font-size="10" fill="#8a7f6a">Clinical settings deliberately strip away the layers a stage act relies on for drama.</text>
</svg>
