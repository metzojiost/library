<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="240" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Anonymity Amplifies the Local Norm</text>

  <rect x="200" y="50" width="160" height="45" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="280" y="77" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">Anonymity</text>

  <path d="M 250 95 L 150 140" stroke="#8a7f6a" stroke-width="1.5"/>
  <path d="M 310 95 L 410 140" stroke="#8a7f6a" stroke-width="1.5"/>

  <rect x="50" y="145" width="200" height="60" rx="8" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="150" y="172" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Norm: cooperative</text>
  <text x="150" y="190" text-anchor="middle" font-size="9" fill="#a15c3e" font-weight="600">amplified cooperation</text>

  <rect x="310" y="145" width="200" height="60" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="410" y="172" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Norm: hostile</text>
  <text x="410" y="190" text-anchor="middle" font-size="9" fill="#5c5648" font-weight="600">amplified hostility</text>

  <text x="280" y="230" text-anchor="middle" font-size="10" fill="#8a7f6a">Same mechanism, opposite outcomes — the local norm decides which.</text>
</svg>
