<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="240" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Never Actually Idle</text>

  <rect x="40" y="55" width="220" height="130" rx="10" fill="#a15c3e" opacity="0.18" stroke="#a15c3e"/>
  <text x="150" y="80" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">At rest</text>
  <text x="150" y="115" text-anchor="middle" font-size="10" fill="#5c5648">mind-wandering,</text>
  <text x="150" y="131" text-anchor="middle" font-size="10" fill="#5c5648">autobiographical memory</text>
  <text x="150" y="160" text-anchor="middle" font-size="11" fill="#a15c3e" font-weight="600">DMN highly active</text>

  <rect x="300" y="55" width="220" height="130" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="410" y="80" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">External task</text>
  <text x="410" y="115" text-anchor="middle" font-size="10" fill="#5c5648">focused attention</text>
  <text x="410" y="131" text-anchor="middle" font-size="10" fill="#5c5648">outward</text>
  <text x="410" y="160" text-anchor="middle" font-size="11" fill="#5c5648" font-weight="600">DMN quiets down</text>

  <text x="280" y="215" text-anchor="middle" font-size="11" fill="#8a7f6a">An actively maintained self-referential mode, not a neutral baseline.</text>
</svg>
