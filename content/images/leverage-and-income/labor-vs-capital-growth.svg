<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Segoe UI, Arial, sans-serif">
  <rect width="640" height="320" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" fill="#2b2620" font-weight="600">Labor Income vs. Capital Income Over Time</text>

  <line x1="80" y1="260" x2="580" y2="260" stroke="#8a7f6a" stroke-width="1.5"/>
  <line x1="80" y1="260" x2="80" y2="60" stroke="#8a7f6a" stroke-width="1.5"/>
  <text x="330" y="290" text-anchor="middle" font-size="12" fill="#5c5648">Years</text>

  <!-- labor: straight line -->
  <line x1="80" y1="240" x2="560" y2="170" stroke="#8a7f6a" stroke-width="3"/>
  <text x="565" y="167" font-size="12" fill="#5c5648">labor (g)</text>

  <!-- capital: exponential curve -->
  <path d="M 80 250 C 250 245, 400 190, 560 70" fill="none" stroke="#a15c3e" stroke-width="3"/>
  <text x="565" y="70" font-size="12" fill="#a15c3e" font-weight="600">capital (r)</text>

  <text x="320" y="305" text-anchor="middle" font-size="11" fill="#8a7f6a">A small rate difference compounds into a large gap given enough time.</text>
</svg>
