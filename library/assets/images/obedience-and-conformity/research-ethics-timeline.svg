<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="200" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">From Famous Studies to Formal Rules</text>

  <line x1="60" y1="110" x2="500" y2="110" stroke="#8a7f6a" stroke-width="1.5"/>

  <circle cx="100" cy="110" r="6" fill="#a15c3e"/>
  <text x="100" y="90" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">1961</text>
  <text x="100" y="135" text-anchor="middle" font-size="9" fill="#5c5648">Milgram</text>

  <circle cx="240" cy="110" r="6" fill="#a15c3e"/>
  <text x="240" y="90" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">1971</text>
  <text x="240" y="135" text-anchor="middle" font-size="9" fill="#5c5648">Stanford Prison Exp.</text>

  <circle cx="440" cy="110" r="6" fill="#2b2620"/>
  <text x="440" y="90" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">1979</text>
  <text x="440" y="135" text-anchor="middle" font-size="9" fill="#5c5648">Belmont Report / IRBs</text>

  <text x="280" y="175" text-anchor="middle" font-size="11" fill="#8a7f6a">Studies that couldn't be run the same way under the rules they helped create.</text>
</svg>
