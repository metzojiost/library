<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="400" fill="#ffffff"/>

  <text x="180" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#5c5648">liberal-leaning weighting</text>
  <text x="420" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#a15c3e">conservative-leaning weighting</text>

  <g font-size="13" fill="#2b2620">
    <text x="10" y="70">Care</text>
    <rect x="90" y="55" width="220" height="16" fill="#a15c3e"/>
    <rect x="310" y="55" width="180" height="16" fill="#8a7f6a"/>

    <text x="10" y="105">Fairness</text>
    <rect x="90" y="90" width="200" height="16" fill="#a15c3e"/>
    <rect x="290" y="90" width="160" height="16" fill="#8a7f6a"/>

    <text x="10" y="140">Liberty</text>
    <rect x="90" y="125" width="150" height="16" fill="#a15c3e"/>
    <rect x="240" y="125" width="150" height="16" fill="#8a7f6a"/>

    <text x="10" y="175">Loyalty</text>
    <rect x="90" y="160" width="60" height="16" fill="#a15c3e"/>
    <rect x="150" y="160" width="200" height="16" fill="#8a7f6a"/>

    <text x="10" y="210">Authority</text>
    <rect x="90" y="195" width="55" height="16" fill="#a15c3e"/>
    <rect x="145" y="195" width="200" height="16" fill="#8a7f6a"/>

    <text x="10" y="245">Sanctity</text>
    <rect x="90" y="230" width="50" height="16" fill="#a15c3e"/>
    <rect x="140" y="230" width="190" height="16" fill="#8a7f6a"/>
  </g>

  <rect x="90" y="280" width="16" height="14" fill="#a15c3e"/>
  <text x="115" y="292" font-size="12" fill="#2b2620">liberal-leaning</text>
  <rect x="240" y="280" width="16" height="14" fill="#8a7f6a"/>
  <text x="265" y="292" font-size="12" fill="#2b2620">conservative-leaning</text>

  <text x="280" y="330" text-anchor="middle" font-size="12.5" fill="#8a7f6a" font-style="italic">Everyone senses all six foundations — the weighting differs, on average, by political leaning.</text>
</svg>
