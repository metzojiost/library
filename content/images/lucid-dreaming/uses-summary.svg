<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="540" height="320" fill="#ffffff"/>

  <g font-size="13" fill="#2b2620">
    <text x="10" y="60">Nightmare treatment</text>
    <rect x="220" y="45" width="300" height="20" fill="#a15c3e"/>
    <text x="530" y="60" font-size="11" fill="#5c5648" text-anchor="start"></text>

    <text x="10" y="120">Skill rehearsal</text>
    <rect x="220" y="105" width="110" height="20" fill="#c9bda6"/>

    <text x="10" y="180">Personal exploration</text>
    <rect x="220" y="165" width="200" height="20" fill="#8a7f6a"/>
  </g>

  <text x="230" y="40" font-size="10.5" fill="#5c5648">well-supported</text>
  <text x="230" y="100" font-size="10.5" fill="#5c5648">preliminary</text>
  <text x="230" y="160" font-size="10.5" fill="#5c5648">widely reported, unstudied</text>

  <text x="270" y="260" text-anchor="middle" font-size="12.5" fill="#8a7f6a" font-style="italic">What the evidence actually supports — strongest for nightmare treatment.</text>
</svg>
