<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="240" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">A Narrow Bottleneck</text>

  <rect x="30" y="55" width="180" height="50" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="120" y="76" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">Centuries of oral,</text>
  <text x="120" y="92" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">pre-Christian belief</text>

  <path d="M 210 80 L 260 80" stroke="#8a7f6a" stroke-width="2" marker-end="url(#armI)"/>

  <rect x="265" y="55" width="130" height="50" rx="8" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="330" y="76" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Poetic Edda</text>
  <text x="330" y="92" text-anchor="middle" font-size="9" fill="#5c5648">c. 1270, anonymous</text>

  <rect x="265" y="120" width="130" height="50" rx="8" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="330" y="141" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Prose Edda</text>
  <text x="330" y="157" text-anchor="middle" font-size="9" fill="#5c5648">c. 1220, Snorri</text>

  <path d="M 210 90 L 260 145" stroke="#8a7f6a" stroke-width="2" marker-end="url(#armI)"/>

  <path d="M 400 80 L 450 110" stroke="#8a7f6a" stroke-width="2"/>
  <path d="M 400 145 L 450 110" stroke="#8a7f6a" stroke-width="2" marker-end="url(#armI)"/>

  <rect x="450" y="88" width="80" height="45" rx="8" fill="#ffffff" stroke="#2b2620"/>
  <text x="490" y="108" text-anchor="middle" font-size="10" fill="#2b2620">what we</text>
  <text x="490" y="122" text-anchor="middle" font-size="10" fill="#2b2620">read today</text>

  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#8a7f6a">Everything modern readers know passed through this two-manuscript bottleneck.</text>

  <defs>
    <marker id="armI" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a7f6a"/>
    </marker>
  </defs>
</svg>
