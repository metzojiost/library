<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="520" height="400" fill="#ffffff"/>

  <line x1="80" y1="330" x2="470" y2="330" stroke="#2b2620" stroke-width="1.5"/>
  <line x1="80" y1="330" x2="80" y2="50" stroke="#2b2620" stroke-width="1.5"/>

  <path d="M80,300 C150,230 220,210 460,205" fill="none" stroke="#8a7f6a" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="465" y="200" font-size="12" fill="#8a7f6a">ordinary repetition</text>

  <path d="M80,300 C160,260 260,150 460,65" fill="none" stroke="#a15c3e" stroke-width="3"/>
  <text x="465" y="65" font-size="12" fill="#a15c3e" font-weight="bold">deliberate practice</text>

  <text x="270" y="365" text-anchor="middle" font-size="12" fill="#2b2620">time invested &#8594;</text>
  <text x="30" y="190" text-anchor="middle" font-size="12" fill="#2b2620" transform="rotate(-90 30 190)">skill level &#8594;</text>

  <text x="270" y="20" text-anchor="middle" font-size="12.5" fill="#8a7f6a" font-style="italic">Repetition alone plateaus; focused, corrected practice keeps pushing the edge of ability.</text>
</svg>
