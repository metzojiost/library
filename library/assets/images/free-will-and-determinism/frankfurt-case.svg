<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">The Dormant Device</text>

  <circle cx="120" cy="130" r="45" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="120" y="126" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Jones</text>
  <text x="120" y="142" text-anchor="middle" font-size="10" fill="#5c5648">decides on his own</text>

  <path d="M 165 130 L 380 130" stroke="#a15c3e" stroke-width="2.5" marker-end="url(#armD)"/>
  <text x="270" y="115" text-anchor="middle" font-size="11" fill="#a15c3e" font-weight="600">actual path taken</text>

  <rect x="380" y="105" width="140" height="50" rx="8" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="450" y="135" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Outcome</text>

  <path d="M 120 175 L 120 210 L 380 210 L 450 155" stroke="#8a7f6a" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#armE)"/>
  <text x="250" y="228" text-anchor="middle" font-size="10" fill="#5c5648">device would intervene here — but never has to</text>

  <text x="280" y="250" text-anchor="middle" font-size="11" fill="#8a7f6a">No alternate possibility existed — yet Jones did all the deciding.</text>

  <defs>
    <marker id="armD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#a15c3e"/>
    </marker>
    <marker id="armE" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a7f6a"/>
    </marker>
  </defs>
</svg>
