  <rect x="20" y="60" width="150" height="90" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="95" y="88" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">Hume</text>
  <text x="95" y="108" text-anchor="middle" font-size="10" fill="#5c5648">bundle theory</text>
  <text x="95" y="124" text-anchor="middle" font-size="9" fill="#5c5648">1730s philosophy</text>

  <rect x="205" y="60" width="150" height="90" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="280" y="88" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">Buddhist anattā</text>
