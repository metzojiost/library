<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="220" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Pendulation</text>

  <circle cx="150" cy="120" r="45" fill="#a15c3e" opacity="0.2" stroke="#a15c3e"/>
  <text x="150" y="116" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">Activated</text>
  <text x="150" y="132" text-anchor="middle" font-size="10" fill="#5c5648">sensation</text>

  <circle cx="410" cy="120" r="45" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="410" y="116" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">Resourced</text>
  <text x="410" y="132" text-anchor="middle" font-size="10" fill="#5c5648">calm state</text>

  <path d="M 200 105 L 360 105" stroke="#8a7f6a" stroke-width="2" marker-end="url(#armK)"/>
  <path d="M 360 140 L 200 140" stroke="#8a7f6a" stroke-width="2" marker-end="url(#armK)"/>

  <text x="280" y="195" text-anchor="middle" font-size="11" fill="#8a7f6a">Small, controlled increments back and forth — never all at once.</text>

  <defs>
    <marker id="armK" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a7f6a"/>
    </marker>
  </defs>
</svg>
