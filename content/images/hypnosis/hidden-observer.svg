<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="240" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Hilgard's Hidden Observer</text>

  <circle cx="280" cy="90" r="34" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="280" y="94" text-anchor="middle" font-size="9" fill="#2b2620" font-weight="600">Hand in</text>
  <text x="280" y="106" text-anchor="middle" font-size="9" fill="#2b2620" font-weight="600">ice water</text>

  <path d="M 260 115 L 150 155" stroke="#8a7f6a" stroke-width="2" marker-end="url(#armH)"/>
  <path d="M 300 115 L 410 155" stroke="#8a7f6a" stroke-width="2" marker-end="url(#armH)"/>

  <rect x="55" y="160" width="190" height="55" rx="8" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="150" y="182" text-anchor="middle" font-size="9" fill="#2b2620" font-weight="600">Verbal, conscious report:</text>
  <text x="150" y="197" text-anchor="middle" font-size="9" fill="#2b2620" font-weight="600">"little or no pain"</text>

  <rect x="315" y="160" width="190" height="55" rx="8" fill="#8a7f6a" opacity="0.18" stroke="#8a7f6a"/>
  <text x="410" y="182" text-anchor="middle" font-size="9" fill="#2b2620" font-weight="600">Hidden channel (key press):</text>
  <text x="410" y="197" text-anchor="middle" font-size="9" fill="#2b2620" font-weight="600">near-baseline pain level</text>

  <text x="280" y="232" text-anchor="middle" font-size="10" fill="#8a7f6a">Two sincere reports, from the same person, at the same moment.</text>

  <defs>
    <marker id="armH" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a7f6a"/>
    </marker>
  </defs>
</svg>
