<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="240" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Different Boundaries, Same Spectrum</text>

  <rect x="60" y="60" width="440" height="40" fill="#f1e3d8" stroke="#e6ddd0"/>
  <line x1="250" y1="55" x2="250" y2="105" stroke="#2b2620" stroke-width="2"/>
  <text x="150" y="50" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">English: "green"</text>
  <text x="400" y="50" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">English: "blue"</text>

  <rect x="60" y="150" width="440" height="40" fill="#f1e3d8" stroke="#e6ddd0"/>
  <line x1="370" y1="145" x2="370" y2="195" stroke="#a15c3e" stroke-width="2"/>
  <text x="220" y="140" text-anchor="middle" font-size="10" fill="#a15c3e" font-weight="600">Himba: one term</text>
  <text x="440" y="140" text-anchor="middle" font-size="10" fill="#a15c3e" font-weight="600">boundary elsewhere</text>

  <text x="280" y="225" text-anchor="middle" font-size="10" fill="#8a7f6a">Perceptual speed tracks each language's own boundary, not a universal one.</text>
</svg>
