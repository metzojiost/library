<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Three Specific Changes</text>

  <rect x="30" y="55" width="160" height="140" rx="10" fill="#a15c3e" opacity="0.2" stroke="#a15c3e"/>
  <text x="110" y="80" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Amygdala</text>
  <text x="110" y="110" text-anchor="middle" font-size="10" fill="#5c5648">alarm</text>
  <text x="110" y="126" text-anchor="middle" font-size="10" fill="#a15c3e" font-weight="600">overactive</text>

  <rect x="200" y="55" width="160" height="140" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="280" y="80" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Prefrontal cortex</text>
  <text x="280" y="110" text-anchor="middle" font-size="10" fill="#5c5648">brakes</text>
  <text x="280" y="126" text-anchor="middle" font-size="10" fill="#5c5648" font-weight="600">underactive</text>

  <rect x="370" y="55" width="160" height="140" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="450" y="80" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Hippocampus</text>
  <text x="450" y="110" text-anchor="middle" font-size="10" fill="#5c5648">timestamping</text>
  <text x="450" y="126" text-anchor="middle" font-size="10" fill="#5c5648" font-weight="600">reduced volume</text>

  <text x="280" y="230" text-anchor="middle" font-size="11" fill="#8a7f6a">Not a vague "trauma changes the brain" — three specific, measurable shifts.</text>
</svg>
