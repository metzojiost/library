<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="280" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">The Chinese Room</text>

  <rect x="150" y="55" width="260" height="170" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="280" y="80" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">The room</text>

  <rect x="180" y="100" width="200" height="55" rx="8" fill="#ffffff" stroke="#8a7f6a"/>
  <text x="280" y="123" text-anchor="middle" font-size="11" fill="#2b2620">Person + English rulebook</text>
  <text x="280" y="140" text-anchor="middle" font-size="11" fill="#5c5648">matches shape to shape</text>

  <text x="280" y="195" text-anchor="middle" font-size="12" fill="#a15c3e" font-weight="600">understands no Chinese</text>

  <text x="60" y="105" text-anchor="middle" font-size="20" fill="#2b2620">入</text>
  <path d="M 80 105 L 145 105" stroke="#a15c3e" stroke-width="2" marker-end="url(#armB)"/>
  <text x="60" y="120" text-anchor="middle" font-size="10" fill="#5c5648">Chinese in</text>

  <text x="500" y="105" text-anchor="middle" font-size="20" fill="#2b2620">出</text>
  <path d="M 415 105 L 480 105" stroke="#a15c3e" stroke-width="2" marker-end="url(#armB)"/>
  <text x="500" y="120" text-anchor="middle" font-size="10" fill="#5c5648">fluent Chinese out</text>

  <text x="280" y="255" text-anchor="middle" font-size="12" fill="#8a7f6a">Convincing output — but the syntax never touches meaning inside.</text>

  <defs>
    <marker id="armB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#a15c3e"/>
    </marker>
  </defs>
</svg>
