<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Cloth Mother vs. Wire Mother</text>

  <rect x="60" y="60" width="140" height="130" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="130" y="90" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Wire mother</text>
  <text x="130" y="110" text-anchor="middle" font-size="10" fill="#5c5648">provides milk</text>
  <text x="130" y="150" text-anchor="middle" font-size="10" fill="#5c5648">brief visits only</text>

  <rect x="360" y="60" width="140" height="130" rx="10" fill="#a15c3e" opacity="0.18" stroke="#a15c3e"/>
  <text x="430" y="90" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Cloth mother</text>
  <text x="430" y="110" text-anchor="middle" font-size="10" fill="#5c5648">no food, soft surface</text>
  <text x="430" y="150" text-anchor="middle" font-size="10" fill="#a15c3e" font-weight="600">most time spent here</text>

  <text x="280" y="225" text-anchor="middle" font-size="11" fill="#8a7f6a">Given the choice, infant monkeys chose comfort over food, every time.</text>
</svg>
