<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="540" height="340" fill="#ffffff"/>

  <defs>
    <marker id="arrow8" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a15c3e"/>
    </marker>
  </defs>

  <rect x="15" y="120" width="130" height="80" rx="10" fill="#f1e3d8" stroke="#a15c3e" stroke-width="2"/>
  <text x="80" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">External</text>
  <text x="80" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">sound</text>

  <rect x="205" y="100" width="150" height="120" rx="10" fill="#efe6d8" stroke="#5c5648" stroke-width="2"/>
  <text x="280" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">Sleep spindle</text>
  <text x="280" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">gating</text>
  <text x="280" y="196" text-anchor="middle" font-size="10.5" fill="#5c5648">more spindles = more filtering</text>

  <rect x="415" y="60" width="110" height="60" rx="10" fill="#e0d5c5" stroke="#8a7f6a" stroke-width="2"/>
  <text x="470" y="95" text-anchor="middle" font-size="11" fill="#2b2620">stays asleep</text>

  <rect x="415" y="200" width="110" height="60" rx="10" fill="#a15c3e"/>
  <text x="470" y="235" text-anchor="middle" font-size="11" fill="#fff">wakes up</text>

  <line x1="145" y1="160" x2="205" y2="160" stroke="#a15c3e" stroke-width="2.5" marker-end="url(#arrow8)"/>
  <line x1="355" y1="140" x2="415" y2="95" stroke="#a15c3e" stroke-width="2.5" marker-end="url(#arrow8)"/>
  <line x1="355" y1="180" x2="415" y2="225" stroke="#a15c3e" stroke-width="2.5" marker-end="url(#arrow8)"/>

  <text x="270" y="300" text-anchor="middle" font-size="12.5" fill="#8a7f6a" font-style="italic">Spindle density is individually variable — more spindles, more protection from external stimuli.</text>
</svg>
