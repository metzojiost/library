<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="520" height="320" fill="#ffffff"/>

  <defs>
    <marker id="arrow10" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a15c3e"/>
    </marker>
  </defs>

  <circle cx="120" cy="140" r="55" fill="#f1e3d8" stroke="#a15c3e" stroke-width="2"/>
  <text x="120" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">Lucid</text>
  <text x="120" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">dreamer</text>

  <circle cx="400" cy="140" r="55" fill="#efe6d8" stroke="#5c5648" stroke-width="2"/>
  <text x="400" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">Dream</text>
  <text x="400" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">character</text>

  <path d="M175,120 Q260,90 345,120" fill="none" stroke="#a15c3e" stroke-width="2.5" marker-end="url(#arrow10)"/>
  <text x="260" y="85" text-anchor="middle" font-size="11" fill="#5c5648">"what's your name?"</text>

  <path d="M345,165 Q260,195 175,165" fill="none" stroke="#a15c3e" stroke-width="2.5" marker-end="url(#arrow10)"/>
  <text x="260" y="215" text-anchor="middle" font-size="11" fill="#5c5648">a response the dreamer didn't plan</text>

  <text x="260" y="280" text-anchor="middle" font-size="12.5" fill="#8a7f6a" font-style="italic">Tholey's interview method — a real question, and an answer that can genuinely surprise the person asking it.</text>
</svg>
