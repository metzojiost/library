<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="240" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Kaptchuk's IBS Trial (2010)</text>

  <rect x="55" y="150" width="120" height="30" fill="#e6ddd0"/>
  <text x="115" y="195" text-anchor="middle" font-size="9" fill="#5c5648">No treatment</text>

  <rect x="220" y="90" width="120" height="90" fill="#a15c3e" opacity="0.55"/>
  <text x="280" y="195" text-anchor="middle" font-size="9" fill="#5c5648">Open-label placebo</text>
  <text x="280" y="207" text-anchor="middle" font-size="9" fill="#5c5648">("this is a placebo")</text>

  <rect x="385" y="85" width="120" height="95" fill="#a15c3e" opacity="0.75"/>
  <text x="445" y="195" text-anchor="middle" font-size="9" fill="#5c5648">Standard deceptive</text>
  <text x="445" y="207" text-anchor="middle" font-size="9" fill="#5c5648">placebo</text>

  <line x1="40" y1="180" x2="530" y2="180" stroke="#8a7f6a" stroke-width="1"/>
  <text x="35" y="90" text-anchor="end" font-size="8" fill="#8a7f6a">Symptom</text>
  <text x="35" y="102" text-anchor="end" font-size="8" fill="#8a7f6a">relief</text>

  <text x="280" y="228" text-anchor="middle" font-size="10" fill="#8a7f6a">Honest disclosure barely dented the effect.</text>
</svg>
