<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="500" height="480" fill="#ffffff"/>

  <rect x="70" y="50" width="180" height="180" fill="#f1e3d8" stroke="#a15c3e" stroke-width="1.5"/>
  <rect x="250" y="50" width="180" height="180" fill="#e6ddd0" stroke="#5c5648" stroke-width="1.5"/>
  <rect x="70" y="230" width="180" height="180" fill="#efe6d8" stroke="#5c5648" stroke-width="1.5"/>
  <rect x="250" y="230" width="180" height="180" fill="#e0d5c5" stroke="#8a7f6a" stroke-width="1.5"/>

  <text x="160" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#a15c3e">Secure</text>
  <text x="160" y="150" text-anchor="middle" font-size="11.5" fill="#5c5648">low anxiety</text>
  <text x="160" y="166" text-anchor="middle" font-size="11.5" fill="#5c5648">low avoidance</text>

  <text x="340" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#5c5648">Anxious</text>
  <text x="340" y="150" text-anchor="middle" font-size="11.5" fill="#5c5648">high anxiety</text>
  <text x="340" y="166" text-anchor="middle" font-size="11.5" fill="#5c5648">low avoidance</text>

  <text x="160" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#5c5648">Avoidant</text>
  <text x="160" y="330" text-anchor="middle" font-size="11.5" fill="#5c5648">low anxiety</text>
  <text x="160" y="346" text-anchor="middle" font-size="11.5" fill="#5c5648">high avoidance</text>

  <text x="340" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#5c5648">Disorganized</text>
  <text x="340" y="330" text-anchor="middle" font-size="11.5" fill="#5c5648">high anxiety</text>
  <text x="340" y="346" text-anchor="middle" font-size="11.5" fill="#5c5648">high avoidance</text>

  <line x1="250" y1="35" x2="250" y2="425" stroke="#2b2620" stroke-width="1.5"/>
  <line x1="55" y1="230" x2="445" y2="230" stroke="#2b2620" stroke-width="1.5"/>

  <text x="250" y="25" text-anchor="middle" font-size="12" fill="#2b2620">anxiety about abandonment &#8594;</text>
  <text x="20" y="230" text-anchor="middle" font-size="12" fill="#2b2620" transform="rotate(-90 20 230)">avoidance of closeness &#8594;</text>

  <text x="250" y="455" text-anchor="middle" font-size="12.5" fill="#8a7f6a" font-style="italic">Four adult attachment patterns, mapped along two underlying dimensions.</text>
</svg>
