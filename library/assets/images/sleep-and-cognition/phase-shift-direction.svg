<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="240" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Two Directions, Different Difficulty</text>

  <rect x="45" y="55" width="220" height="130" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="155" y="80" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">Phase delay</text>
  <text x="155" y="98" text-anchor="middle" font-size="9" fill="#5c5648">Day → night shift</text>
  <path d="M 80 130 L 230 130" stroke="#8a7f6a" stroke-width="2" marker-end="url(#armP)"/>
  <text x="155" y="150" text-anchor="middle" font-size="9" fill="#5c5648">rhythm pushed later</text>
  <text x="155" y="167" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Easier, faster</text>

  <rect x="295" y="55" width="220" height="130" rx="8" fill="#a15c3e" opacity="0.18" stroke="#a15c3e"/>
  <text x="405" y="80" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">Phase advance</text>
  <text x="405" y="98" text-anchor="middle" font-size="9" fill="#5c5648">Night → day shift</text>
  <path d="M 480 130 L 330 130" stroke="#a15c3e" stroke-width="2" marker-end="url(#armP)"/>
  <text x="405" y="150" text-anchor="middle" font-size="9" fill="#5c5648">rhythm pushed earlier</text>
  <text x="405" y="167" text-anchor="middle" font-size="10" fill="#a15c3e" font-weight="700">Harder, slower</text>

  <text x="280" y="215" text-anchor="middle" font-size="10" fill="#8a7f6a">The same asymmetry behind why eastward jet lag hits harder than westward.</text>

  <defs>
    <marker id="armP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a7f6a"/>
    </marker>
  </defs>
</svg>
