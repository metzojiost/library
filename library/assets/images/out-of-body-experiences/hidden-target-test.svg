<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="240" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">The Hidden-Target Test</text>

  <rect x="60" y="60" width="440" height="30" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="280" y="80" text-anchor="middle" font-size="10" fill="#5c5648">high shelf — target visible only from ceiling vantage</text>

  <rect x="230" y="55" width="30" height="20" fill="#a15c3e" opacity="0.5"/>

  <rect x="180" y="170" width="200" height="40" rx="6" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="280" y="195" text-anchor="middle" font-size="10" fill="#5c5648">patient — cannot see target</text>

  <text x="280" y="235" text-anchor="middle" font-size="10" fill="#8a7f6a">Combined studies: no identification rate above chance.</text>
</svg>
