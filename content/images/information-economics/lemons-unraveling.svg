<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">The Lemons Spiral</text>

  <rect x="30" y="60" width="115" height="70" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="87" y="90" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Buyer offers</text>
  <text x="87" y="106" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">average price</text>

  <path d="M 145 95 L 180 95" stroke="#a15c3e" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="180" y="60" width="115" height="70" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="237" y="83" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Best sellers</text>
  <text x="237" y="99" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">exit (undervalued</text>
  <text x="237" y="115" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">at that price)</text>

  <path d="M 295 95 L 330 95" stroke="#a15c3e" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="330" y="60" width="115" height="70" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="387" y="90" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Average quality</text>
  <text x="387" y="106" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">left drops</text>

  <path d="M 387 130 C 387 175, 87 175, 87 175 L 87 155" stroke="#a15c3e" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <text x="237" y="195" text-anchor="middle" font-size="11" fill="#5c5648">buyers lower their offer again — the cycle repeats</text>

  <rect x="150" y="220" width="260" height="55" rx="8" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="280" y="243" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Stable result: only low-quality</text>
  <text x="280" y="260" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">goods remain on the market</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#a15c3e"/>
    </marker>
  </defs>
</svg>
