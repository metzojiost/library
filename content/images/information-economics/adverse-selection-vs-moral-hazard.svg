<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="280" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">Split by Timing, Not Just by Topic</text>

  <line x1="280" y1="55" x2="280" y2="230" stroke="#8a7f6a" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="280" cy="140" r="5" fill="#2b2620"/>
  <text x="280" y="245" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">deal signed</text>

  <rect x="50" y="70" width="200" height="130" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="150" y="95" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Before the deal</text>
  <text x="150" y="120" text-anchor="middle" font-size="11" fill="#5c5648">hidden pre-existing</text>
  <text x="150" y="135" text-anchor="middle" font-size="11" fill="#5c5648">type, undisclosed</text>
  <text x="150" y="170" text-anchor="middle" font-size="13" fill="#2b2620" font-weight="600">= adverse selection</text>

  <rect x="310" y="70" width="200" height="130" rx="10" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="410" y="95" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">After the deal</text>
  <text x="410" y="120" text-anchor="middle" font-size="11" fill="#a15c3e" font-weight="600">hidden behavior, changed</text>
  <text x="410" y="135" text-anchor="middle" font-size="11" fill="#a15c3e" font-weight="600">by the deal itself</text>
  <text x="410" y="170" text-anchor="middle" font-size="13" fill="#2b2620" font-weight="600">= moral hazard</text>

  <text x="280" y="265" text-anchor="middle" font-size="11" fill="#8a7f6a">Same family — hidden information the other side can't verify — split by when it arises.</text>
</svg>
