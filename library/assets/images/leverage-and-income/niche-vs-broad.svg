<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">Reach vs. Relevance</text>

  <!-- broad -->
  <circle cx="150" cy="150" r="90" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="150" y="150" text-anchor="middle" font-size="13" fill="#2b2620" font-weight="600">Broad topic</text>
  <text x="150" y="170" text-anchor="middle" font-size="11" fill="#5c5648">large reach,</text>
  <text x="150" y="185" text-anchor="middle" font-size="11" fill="#5c5648">low relevance</text>

  <!-- niche -->
  <circle cx="410" cy="150" r="55" fill="#a15c3e" opacity="0.2" stroke="#a15c3e"/>
  <text x="410" y="145" text-anchor="middle" font-size="13" fill="#2b2620" font-weight="600">Niche topic</text>
  <text x="410" y="163" text-anchor="middle" font-size="11" fill="#5c5648">smaller reach,</text>
  <text x="410" y="178" text-anchor="middle" font-size="11" fill="#a15c3e" font-weight="600">high relevance</text>

  <text x="280" y="270" text-anchor="middle" font-size="12" fill="#8a7f6a">Engagement per viewer, not raw reach, drives most distribution and conversion.</text>
</svg>
