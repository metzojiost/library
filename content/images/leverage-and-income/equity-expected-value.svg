<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">Equity Outcome Distribution</text>

  <line x1="70" y1="240" x2="520" y2="240" stroke="#8a7f6a" stroke-width="1.5"/>
  <line x1="70" y1="240" x2="70" y2="60" stroke="#8a7f6a" stroke-width="1.5"/>

  <!-- tall bar at $0 -->
  <rect x="100" y="80" width="70" height="160" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="135" y="70" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">most likely: $0</text>

  <!-- small bar far right -->
  <rect x="440" y="215" width="30" height="25" fill="#a15c3e"/>
  <text x="455" y="205" text-anchor="middle" font-size="11" fill="#a15c3e" font-weight="600">rare: $10M</text>

  <!-- expected value marker -->
  <line x1="260" y1="60" x2="260" y2="240" stroke="#2b2620" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">expected value: $100K</text>

  <text x="280" y="270" text-anchor="middle" font-size="12" fill="#8a7f6a">The likeliest outcome and the expected value are different numbers.</text>
</svg>
