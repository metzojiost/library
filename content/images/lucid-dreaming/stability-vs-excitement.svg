<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="540" height="360" fill="#ffffff"/>

  <line x1="70" y1="300" x2="500" y2="300" stroke="#2b2620" stroke-width="1.5"/>
  <line x1="70" y1="300" x2="70" y2="50" stroke="#2b2620" stroke-width="1.5"/>

  <line x1="70" y1="120" x2="500" y2="120" stroke="#8a7f6a" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="505" y="124" font-size="11" fill="#8a7f6a">wake threshold</text>

  <path d="M70,260 C130,240 160,140 200,100 C230,150 260,90 300,180 C330,230 400,160 500,190" fill="none" stroke="#a15c3e" stroke-width="3"/>

  <text x="200" y="90" text-anchor="middle" font-size="11" fill="#2b2620">realize you're</text>
  <text x="200" y="105" text-anchor="middle" font-size="11" fill="#2b2620">dreaming</text>

  <text x="300" y="200" text-anchor="middle" font-size="11" fill="#a15c3e" font-weight="bold">stabilization</text>
  <text x="300" y="215" text-anchor="middle" font-size="11" fill="#a15c3e" font-weight="bold">pulls it back down</text>

  <text x="285" y="335" text-anchor="middle" font-size="12.5" fill="#8a7f6a" font-style="italic">Excitement right after becoming lucid often crosses the threshold that wakes you.</text>
</svg>
