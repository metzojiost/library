<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" fill="#2b2620" font-weight="600">Four Types of Leverage</text>

  <!-- column headers -->
  <text x="200" y="62" text-anchor="middle" font-size="13" fill="#5c5648" font-weight="600">PERMISSIONED</text>
  <text x="440" y="62" text-anchor="middle" font-size="13" fill="#a15c3e" font-weight="600">PERMISSIONLESS</text>

  <!-- Labor box -->
  <rect x="80" y="80" width="240" height="130" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="200" y="115" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Labor</text>
  <text x="200" y="140" text-anchor="middle" font-size="12" fill="#5c5648">Other people</text>
  <text x="200" y="158" text-anchor="middle" font-size="12" fill="#5c5648">working for you</text>
  <text x="200" y="185" text-anchor="middle" font-size="11" fill="#8a7f6a">requires their</text>
  <text x="200" y="200" text-anchor="middle" font-size="11" fill="#8a7f6a">agreement to hire/manage</text>

  <!-- Capital box -->
  <rect x="80" y="230" width="240" height="130" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="200" y="265" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Capital</text>
  <text x="200" y="290" text-anchor="middle" font-size="12" fill="#5c5648">Money</text>
  <text x="200" y="308" text-anchor="middle" font-size="12" fill="#5c5648">working for you</text>
  <text x="200" y="335" text-anchor="middle" font-size="11" fill="#8a7f6a">requires access:</text>
  <text x="200" y="350" text-anchor="middle" font-size="11" fill="#8a7f6a">savings, credit, investors</text>

  <!-- Code box -->
  <rect x="320" y="80" width="240" height="130" rx="10" fill="#a15c3e" opacity="0.12" stroke="#a15c3e"/>
  <text x="440" y="115" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Code</text>
  <text x="440" y="140" text-anchor="middle" font-size="12" fill="#5c5648">Software</text>
  <text x="440" y="158" text-anchor="middle" font-size="12" fill="#5c5648">working while you sleep</text>
  <text x="440" y="185" text-anchor="middle" font-size="11" fill="#a15c3e">no permission needed —</text>
  <text x="440" y="200" text-anchor="middle" font-size="11" fill="#a15c3e">just skill and a computer</text>

  <!-- Media box -->
  <rect x="320" y="230" width="240" height="130" rx="10" fill="#a15c3e" opacity="0.12" stroke="#a15c3e"/>
  <text x="440" y="265" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Media</text>
  <text x="440" y="290" text-anchor="middle" font-size="12" fill="#5c5648">Content reaching</text>
  <text x="440" y="308" text-anchor="middle" font-size="12" fill="#5c5648">unlimited people</text>
  <text x="440" y="335" text-anchor="middle" font-size="11" fill="#a15c3e">near-zero marginal cost</text>
  <text x="440" y="350" text-anchor="middle" font-size="11" fill="#a15c3e">per additional viewer</text>

  <text x="320" y="385" text-anchor="middle" font-size="12" fill="#8a7f6a">Code and media are the historically new options — available without anyone's approval.</text>
</svg>
