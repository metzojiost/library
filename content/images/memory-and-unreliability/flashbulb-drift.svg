<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Accuracy Drops, Confidence Doesn't</text>

  <line x1="60" y1="210" x2="500" y2="210" stroke="#8a7f6a" stroke-width="1.5"/>
  <line x1="60" y1="210" x2="60" y2="50" stroke="#8a7f6a" stroke-width="1.5"/>

  <path d="M 90 70 L 470 200" stroke="#a15c3e" stroke-width="2.5" fill="none"/>
  <text x="480" y="205" font-size="10" fill="#a15c3e" font-weight="600">accuracy</text>

  <path d="M 90 90 L 470 85" stroke="#2b2620" stroke-width="2.5" fill="none"/>
  <text x="480" y="80" font-size="10" fill="#2b2620" font-weight="600">confidence</text>

  <text x="280" y="235" text-anchor="middle" font-size="11" fill="#5c5648">time since the event</text>
  <text x="280" y="250" text-anchor="middle" font-size="11" fill="#8a7f6a">One line stays flat. The other doesn't — and nobody can feel the difference from inside.</text>
</svg>
