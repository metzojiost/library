<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">Cost of the Same Signal, by Type</text>

  <line x1="70" y1="250" x2="500" y2="250" stroke="#8a7f6a" stroke-width="1.5"/>
  <line x1="70" y1="250" x2="70" y2="60" stroke="#8a7f6a" stroke-width="1.5"/>
  <text x="285" y="278" text-anchor="middle" font-size="12" fill="#5c5648">Signal intensity (e.g. years of schooling)</text>
  <text x="40" y="155" text-anchor="middle" font-size="12" fill="#5c5648" transform="rotate(-90 40 155)">Cost to sender</text>

  <!-- low-ability steep cost line -->
  <path d="M 70 245 L 500 75" stroke="#2b2620" stroke-width="2.5" fill="none"/>
  <text x="505" y="72" font-size="11" fill="#2b2620">low-ability cost</text>

  <!-- high-ability flatter cost line -->
  <path d="M 70 245 L 500 175" stroke="#a15c3e" stroke-width="2.5" fill="none"/>
  <text x="505" y="178" font-size="11" fill="#a15c3e" font-weight="600">high-ability cost</text>

  <!-- separating signal level marker -->
  <line x1="330" y1="250" x2="330" y2="60" stroke="#8a7f6a" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="330" y="50" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">signal level where</text>
  <text x="330" y="63" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">only high-ability pays</text>

  <circle cx="330" cy="197" r="4" fill="#a15c3e"/>
  <circle cx="330" cy="128" r="4" fill="#2b2620"/>

  <text x="280" y="295" text-anchor="middle" font-size="11" fill="#8a7f6a">The gap between the two lines is what makes the signal credible.</text>
</svg>
