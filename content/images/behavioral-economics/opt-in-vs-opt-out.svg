<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="480" height="380" fill="#ffffff"/>

  <line x1="90" y1="300" x2="420" y2="300" stroke="#2b2620" stroke-width="1.5"/>
  <line x1="90" y1="300" x2="90" y2="50" stroke="#2b2620" stroke-width="1.5"/>

  <rect x="150" y="255" width="80" height="45" fill="#8a7f6a"/>
  <text x="190" y="245" text-anchor="middle" font-size="15" font-weight="bold" fill="#5c5648">~15%</text>
  <text x="190" y="322" text-anchor="middle" font-size="12" fill="#2b2620">Opt-in default</text>

  <rect x="290" y="75" width="80" height="225" fill="#a15c3e"/>
  <text x="330" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#a15c3e">~90%</text>
  <text x="330" y="322" text-anchor="middle" font-size="12" fill="#2b2620">Opt-out default</text>

  <text x="70" y="55" text-anchor="end" font-size="11" fill="#8a7f6a">100%</text>
  <text x="70" y="300" text-anchor="end" font-size="11" fill="#8a7f6a">0%</text>

  <text x="255" y="355" text-anchor="middle" font-size="12.5" fill="#8a7f6a" font-style="italic">Organ donation consent rates — same choice, same consequences, different default.</text>
</svg>
