<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="240" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Two Ways to Forecast</text>

  <rect x="40" y="55" width="220" height="120" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="150" y="80" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Inside view</text>
  <text x="150" y="110" text-anchor="middle" font-size="10" fill="#5c5648">this specific plan,</text>
  <text x="150" y="125" text-anchor="middle" font-size="10" fill="#5c5648">these specific steps</text>
  <text x="150" y="150" text-anchor="middle" font-size="10" fill="#a15c3e" font-weight="600">tends toward best case</text>

  <rect x="300" y="55" width="220" height="120" rx="10" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="410" y="80" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Outside view</text>
  <text x="410" y="110" text-anchor="middle" font-size="10" fill="#5c5648">how long did plans</text>
  <text x="410" y="125" text-anchor="middle" font-size="10" fill="#5c5648">like this actually take</text>
  <text x="410" y="150" text-anchor="middle" font-size="10" fill="#a15c3e" font-weight="600">grounded in track record</text>

  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#8a7f6a">The outside view never has to imagine this project's specific success at all.</text>
</svg>
