<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter 1: Test — Test</title>
<link rel="stylesheet" href="../../../assets/style.css">
</head>
<body>
<div class="page">
<header class="topbar">
  <a class="brand" href="../../../index.html">📚 My Library</a>
  <nav class="breadcrumbs"><a href="../../../index.html">Library</a> / <span>Economics</span> / <a href="index.html">Test</a> / <span>Chapter 1: Test</span></nav>
</header>
<main>

<article class="chapter">
<h1 class="page-title">Chapter 1: Test</h1>
<p class="chapter-meta">~1 min read</p>
<p>test</p>

</article>

<div class="read-toggle">
  <div class="read-toggle-row">
    <label class="read-toggle-label">
      <input type="checkbox" class="read-checkbox" data-topic="test" data-chapter="chapter-1"  >
      Mark this chapter as read
    </label>
    <button type="button" class="confirm-read-btn ">Confirm</button>
    <a href="#" class="change-read-link is-hidden">change</a>
  </div>
</div>
<script>
(function() {
  var wrap = document.currentScript.previousElementSibling;
  var box = wrap.querySelector('.read-checkbox');
  var confirmBtn = wrap.querySelector('.confirm-read-btn');
  var changeLink = wrap.querySelector('.change-read-link');

  function save() {
    fetch('/api/progress', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({topic: box.dataset.topic, chapter: box.dataset.chapter, read: box.checked})
    }).catch(function() {});
  }

  confirmBtn.addEventListener('click', function() {
    save();
    box.disabled = true;
    confirmBtn.classList.add('is-hidden');
    changeLink.classList.remove('is-hidden');
  });

  changeLink.addEventListener('click', function(e) {
    e.preventDefault();
    box.disabled = false;
    confirmBtn.classList.remove('is-hidden');
    changeLink.classList.add('is-hidden');
  });

  if (location.protocol === 'file:') {
    var note = document.createElement('p');
    note.className = 'read-toggle-note';
    note.textContent = "This won't be saved permanently \u2014 open the library via Start Library.bat instead of double-clicking the page to keep your progress.";
    wrap.appendChild(note);
  }
})();
</script>

<div class="chapter-footer-nav">
  <div></div>
  <a class="nav-link" href="index.html">All chapters</a>
  <div></div>
</div>

</main>
</div>
</body>
</html>
