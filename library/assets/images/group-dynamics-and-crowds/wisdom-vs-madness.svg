<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Four Conditions Decide Which</text>

  <rect x="30" y="55" width="120" height="55" rx="6" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="90" y="87" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Diversity</text>

  <rect x="160" y="55" width="120" height="55" rx="6" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="220" y="87" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Independence</text>

  <rect x="290" y="55" width="120" height="55" rx="6" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="350" y="87" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Decentralization</text>

  <rect x="420" y="55" width="120" height="55" rx="6" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="480" y="87" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Aggregation</text>

  <path d="M 280 115 L 280 150" stroke="#8a7f6a" stroke-width="1.5"/>

  <rect x="130" y="155" width="150" height="55" rx="8" fill="#a15c3e" opacity="0.18" stroke="#a15c3e"/>
  <text x="205" y="188" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">wise crowd</text>

  <rect x="300" y="155" width="150" height="55" rx="8" fill="#8a7f6a" opacity="0.2" stroke="#8a7f6a"/>
  <text x="375" y="180" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">conditions fail →</text>
  <text x="375" y="196" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">mob / conformity</text>

  <text x="280" y="240" text-anchor="middle" font-size="10" fill="#8a7f6a">The same underlying crowd — the four conditions decide the outcome.</text>
</svg>
