<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="220" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">The Same Setback, Two Interpretations</text>

  <rect x="50" y="55" width="210" height="130" rx="8" fill="#e6ddd0" stroke="#8a7f6a" stroke-dasharray="3,3"/>
  <text x="155" y="80" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Fixed mindset</text>
  <text x="155" y="105" text-anchor="middle" font-size="9" fill="#5c5648">Ability is a fixed trait</text>
  <text x="155" y="125" text-anchor="middle" font-size="9" fill="#5c5648">Failure = "I lack talent"</text>
  <text x="155" y="145" text-anchor="middle" font-size="9" fill="#5c5648">Avoids challenge and</text>
  <text x="155" y="160" text-anchor="middle" font-size="9" fill="#5c5648">criticism</text>

  <rect x="300" y="55" width="210" height="130" rx="8" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="405" y="80" text-anchor="middle" font-size="10" fill="#2b2620" font-weight="600">Growth mindset</text>
  <text x="405" y="105" text-anchor="middle" font-size="9" fill="#5c5648">Ability is developable</text>
  <text x="405" y="125" text-anchor="middle" font-size="9" fill="#5c5648">Failure = "adjust strategy"</text>
  <text x="405" y="145" text-anchor="middle" font-size="9" fill="#5c5648">Seeks challenge and</text>
  <text x="405" y="160" text-anchor="middle" font-size="9" fill="#5c5648">criticism as information</text>

  <text x="280" y="210" text-anchor="middle" font-size="10" fill="#8a7f6a">Most people are a mix, often fixed in one area and growth-oriented in another.</text>
</svg>
