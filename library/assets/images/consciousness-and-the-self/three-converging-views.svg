  <rect x="390" y="60" width="150" height="90" rx="8" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="465" y="88" text-anchor="middle" font-size="11" fill="#2b2620" font-weight="600">Default mode</text>
