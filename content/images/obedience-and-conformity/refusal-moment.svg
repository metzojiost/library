<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="220" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Not a Standing Principle — a Moment</text>

  <rect x="30" y="55" width="220" height="100" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="140" y="85" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">"Following procedure"</text>
  <text x="140" y="115" text-anchor="middle" font-size="10" fill="#5c5648">the agentic state</text>

  <path d="M 255 105 L 305 105" stroke="#a15c3e" stroke-width="2.5" marker-end="url(#armL)"/>
  <text x="280" y="90" text-anchor="middle" font-size="9" fill="#a15c3e" font-weight="600">specific triggering moment</text>

  <rect x="310" y="55" width="220" height="100" rx="10" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="420" y="85" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">"I am causing harm"</text>
  <text x="420" y="115" text-anchor="middle" font-size="10" fill="#5c5648">reclaimed responsibility</text>

  <text x="280" y="195" text-anchor="middle" font-size="11" fill="#8a7f6a">The reframing, not a pre-held belief, is usually what breaks compliance.</text>

  <defs>
    <marker id="armL" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#a15c3e"/>
    </marker>
  </defs>
</svg>
