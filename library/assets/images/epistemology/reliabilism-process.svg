<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">Judging the Process, Not the Justification</text>

  <rect x="40" y="55" width="220" height="140" rx="10" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="150" y="80" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Reliable process</text>
  <text x="150" y="110" text-anchor="middle" font-size="11" fill="#5c5648">functioning vision,</text>
  <text x="150" y="126" text-anchor="middle" font-size="11" fill="#5c5648">good light</text>
  <text x="150" y="160" text-anchor="middle" font-size="12" fill="#a15c3e" font-weight="600">true belief = knowledge</text>

  <rect x="300" y="55" width="220" height="140" rx="10" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="410" y="80" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">Unreliable process</text>
  <text x="410" y="110" text-anchor="middle" font-size="11" fill="#5c5648">a stopped clock,</text>
  <text x="410" y="126" text-anchor="middle" font-size="11" fill="#5c5648">right by accident</text>
  <text x="410" y="160" text-anchor="middle" font-size="12" fill="#2b2620" font-weight="600">true belief ≠ knowledge</text>

  <text x="280" y="230" text-anchor="middle" font-size="11" fill="#8a7f6a">Same true belief, different process — only one counts as knowledge.</text>
</svg>
