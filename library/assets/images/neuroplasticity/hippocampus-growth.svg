<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="230" fill="#ffffff"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="600">Hippocampal Growth in London Taxi Drivers</text>

  <line x1="60" y1="180" x2="500" y2="180" stroke="#8a7f6a" stroke-width="1"/>
  <line x1="60" y1="55" x2="60" y2="180" stroke="#8a7f6a" stroke-width="1"/>

  <polyline points="60,150 160,148 260,110 360,90 460,80" fill="none" stroke="#a15c3e" stroke-width="2.5"/>
  <polyline points="60,150 160,150 260,150 360,150 460,150" fill="none" stroke="#8a7f6a" stroke-width="2" stroke-dasharray="4,3"/>

  <text x="60" y="198" text-anchor="middle" font-size="8" fill="#5c5648">Before</text>
  <text x="160" y="198" text-anchor="middle" font-size="8" fill="#5c5648">Training</text>
  <text x="260" y="198" text-anchor="middle" font-size="8" fill="#5c5648">Passed exam</text>
  <text x="460" y="198" text-anchor="middle" font-size="8" fill="#5c5648">Years later</text>

  <text x="465" y="76" font-size="9" fill="#a15c3e" font-weight="600">Taxi drivers</text>
  <text x="465" y="146" font-size="9" fill="#8a7f6a" font-weight="600">Controls</text>

  <text x="35" y="115" text-anchor="end" font-size="8" fill="#8a7f6a">Hippocampal</text>
  <text x="35" y="127" text-anchor="end" font-size="8" fill="#8a7f6a">gray matter</text>
</svg>
