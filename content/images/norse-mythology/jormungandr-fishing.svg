<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="240" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">Fishing for the World Serpent</text>

  <rect x="40" y="150" width="480" height="50" fill="#a15c3e" opacity="0.12"/>
  <text x="60" y="180" font-size="10" fill="#5c5648">ocean depths</text>

  <circle cx="150" cy="90" r="20" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="150" y="94" text-anchor="middle" font-size="10" fill="#2b2620">Thor's boat</text>

  <path d="M 150 110 Q 200 150, 260 175" stroke="#8a7f6a" stroke-width="1.5" fill="none"/>
  <path d="M 260 175 Q 340 190, 420 160 Q 470 140, 460 100" stroke="#a15c3e" stroke-width="4" fill="none"/>
  <text x="420" y="90" text-anchor="middle" font-size="11" fill="#a15c3e" font-weight="600">Jörmungandr</text>

  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#8a7f6a">Hauled to the surface, then released — a rehearsal for Ragnarok.</text>
</svg>
