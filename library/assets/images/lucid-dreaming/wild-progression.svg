<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="340" fill="#ffffff"/>

  <defs>
    <marker id="arrow9" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a15c3e"/>
    </marker>
  </defs>

  <rect x="10" y="120" width="120" height="90" rx="10" fill="#f1e3d8" stroke="#a15c3e" stroke-width="2"/>
  <text x="70" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">Stillness</text>
  <text x="70" y="173" text-anchor="middle" font-size="10" fill="#5c5648">no movement</text>

  <rect x="150" y="120" width="120" height="90" rx="10" fill="#efe6d8" stroke="#5c5648" stroke-width="2"/>
  <text x="210" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">Proprioceptive</text>
  <text x="210" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">drift</text>
  <text x="210" y="185" text-anchor="middle" font-size="10" fill="#5c5648">limbs feel absent</text>

  <rect x="290" y="120" width="120" height="90" rx="10" fill="#e6ddd0" stroke="#8a7f6a" stroke-width="2"/>
  <text x="350" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">Imagined</text>
  <text x="350" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2620">movement</text>
  <text x="350" y="185" text-anchor="middle" font-size="10" fill="#5c5648">replaces real sensation</text>

  <rect x="430" y="120" width="120" height="90" rx="10" fill="#a15c3e"/>
  <text x="490" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Direct entry</text>
  <text x="490" y="173" text-anchor="middle" font-size="10" fill="#fff">into a dream</text>

  <line x1="130" y1="165" x2="150" y2="165" stroke="#a15c3e" stroke-width="2.5" marker-end="url(#arrow9)"/>
  <line x1="270" y1="165" x2="290" y2="165" stroke="#a15c3e" stroke-width="2.5" marker-end="url(#arrow9)"/>
  <line x1="410" y1="165" x2="430" y2="165" stroke="#a15c3e" stroke-width="2.5" marker-end="url(#arrow9)"/>

  <text x="280" y="270" text-anchor="middle" font-size="12.5" fill="#8a7f6a" font-style="italic">No gap of unconsciousness in between — that's what separates WILD from every other induction method.</text>
</svg>
