<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#2b2620" font-weight="600">Same Leverage, Symmetric Effect</text>

  <line x1="280" y1="60" x2="280" y2="240" stroke="#e6ddd0"/>

  <!-- gain side -->
  <text x="150" y="65" text-anchor="middle" font-size="13" fill="#5c5648" font-weight="600">Asset +10%</text>
  <rect x="110" y="100" width="80" height="100" fill="#a15c3e" opacity="0.15" stroke="#a15c3e"/>
  <text x="150" y="155" text-anchor="middle" font-size="16" fill="#a15c3e" font-weight="700">+50%</text>
  <text x="150" y="175" text-anchor="middle" font-size="11" fill="#5c5648">return on cash</text>

  <!-- loss side -->
  <text x="410" y="65" text-anchor="middle" font-size="13" fill="#5c5648" font-weight="600">Asset -10%</text>
  <rect x="370" y="100" width="80" height="100" fill="#f1e3d8" stroke="#e6ddd0"/>
  <text x="410" y="155" text-anchor="middle" font-size="16" fill="#2b2620" font-weight="700">-50%</text>
  <text x="410" y="175" text-anchor="middle" font-size="11" fill="#5c5648">loss on cash</text>

  <text x="280" y="230" text-anchor="middle" font-size="12" fill="#8a7f6a">5-to-1 leverage: a 10% asset move becomes a 50% move on the cash actually put in — either way.</text>
</svg>
